<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WG106 — Lecture 3: Data Simulation</title>
<style>
  :root { --ok:#1a7f37; --okbg:#e8f5ec; --bad:#cf222e; --badbg:#fbe9ea;
          --line:#d0d7de; --muted:#57606a; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.5; color: #1f2328; margin: 0; padding: 1.5rem 1rem 5rem;
         background: #f6f8fa; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .q { background: #fff; border: 1px solid var(--line); border-radius: 10px;
       padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .q.correct { border-color: var(--ok); background: var(--okbg); }
  .q.incorrect { border-color: var(--bad); background: var(--badbg); }
  .stem { margin: 0 0 0.75rem; font-weight: 600; }
  .ar-line { margin: 0.15rem 0; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.3rem 0.4rem;
         border-radius: 6px; }
  .opt:hover { background: rgba(9,105,218,0.06); }
  .opt input { margin-top: 0.3rem; }
  .opt label { cursor: pointer; flex: 1; }
  .tier { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); }
  .tier-q { font-weight: 600; margin-bottom: 0.4rem; }
  .stmt { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.4rem 0;
          border-bottom: 1px solid #f0f0f0; }
  .stmt-text { flex: 1; }
  .stmt-tf label { margin-left: 0.6rem; }
  .mark { font-weight: 700; margin-left: 0.4rem; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--bad); }
  table.match { width: 100%; border-collapse: collapse; }
  table.match td { padding: 0.35rem 0.4rem; vertical-align: top; }
  .right-col { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
  select { padding: 0.25rem; border: 1px solid var(--line); border-radius: 6px;
           font-size: 0.95rem; background: #fff; }
  .feedback { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px;
              background: #fff; border: 1px solid var(--line); display: none; }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.ok { color: var(--ok); }
  .feedback .verdict.no { color: var(--bad); }
  .feedback .ans { margin-top: 0.3rem; }
  .feedback .expl { margin-top: 0.3rem; color: var(--muted); }
  .bar { position: sticky; bottom: 0; background: #f6f8fa; padding: 0.75rem 0;
         display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #score { font-weight: 700; font-size: 1.1rem; }
  .li-pos { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
  .li-pos .li-text { flex: 1; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Answer the questions, then press <strong>Check answers</strong>. Your selections stay private until you submit.</p>
  <div id="quiz"></div>
  <div class="bar">
    <button id="check">Check answers</button>
    <button id="reset" class="secondary">Reset</button>
    <span id="score" role="status" aria-live="polite"></span>
  </div>
</main>
<script id="quiz-data" type="application/json">{"title": "WG106 — Lecture 3: Data Simulation", "questions": [{"type": "single", "stem": "The lecture frames 'data science' as spanning two broad strands. They are:", "options": [{"letter": "A", "text": "Qualitative coding and text mining"}, {"letter": "B", "text": "Computer hardware engineering and routine software testing"}, {"letter": "C", "text": "Inferential statistics and machine learning"}, {"letter": "D", "text": "Data cleaning and data visualisation"}], "correct": "C", "explanation": "The intro positions data science between inferential statistics (estimation/testing) and machine learning (prediction), which frames the methods questions that follow."}, {"type": "single", "stem": "Which of the following is NOT given as a legitimate reason to simulate data?", "options": [{"letter": "A", "text": "To evaluate and compare statistical methods"}, {"letter": "B", "text": "To pilot and test an entire analysis plan before any real data are collected"}, {"letter": "C", "text": "To create illustrative datasets for teaching"}, {"letter": "D", "text": "To fabricate results that support a desired conclusion"}], "correct": "D", "explanation": "Valid reasons include method evaluation, testing an analysis pipeline, and education. Fabricating results (fraud) is explicitly excluded."}, {"type": "single", "stem": "MNIST and iris are mentioned in the lecture as examples of:", "options": [{"letter": "A", "text": "Benchmark datasets used to evaluate and compare methods"}, {"letter": "B", "text": "Crowdsourcing platforms for data annotation"}, {"letter": "C", "text": "Standard probability distributions that ship with base R"}, {"letter": "D", "text": "Functions for simulating skewed variables"}], "correct": "A", "explanation": "MNIST (handwritten digits) and iris (flower measurements) are standard benchmark datasets against which methods are tested and compared."}, {"type": "single", "stem": "Why might a researcher prefer simulated data over a benchmark dataset when evaluating a new method?", "options": [{"letter": "A", "text": "Simulated datasets are always far larger than any benchmark dataset that is available"}, {"letter": "B", "text": "With simulated data the true data-generating process is known, so accuracy can be checked exactly"}, {"letter": "C", "text": "Simulated data never contain any noise or measurement error"}, {"letter": "D", "text": "Benchmark datasets cannot be loaded into R without special packages"}], "correct": "B", "explanation": "Because you set the parameters, you know the ground truth and can measure how well a method recovers it — something real benchmarks rarely allow."}, {"type": "single", "stem": "R is described in the lecture as which kind of language and ecosystem?", "options": [{"letter": "A", "text": "A database query language for relational tables"}, {"letter": "B", "text": "A markup language used mainly for formatting documents"}, {"letter": "C", "text": "A compiled, proprietary language built around a closed and fixed standard library"}, {"letter": "D", "text": "An interpreted, open-source language with a large package ecosystem"}], "correct": "D", "explanation": "R is interpreted and open-source, with extensive contributed packages; RStudio provides the IDE and supports reproducible workflows (LaTeX/Markdown)."}, {"type": "matching", "stem": "Match each measurement level to a correct example:", "lefts": [{"num": 1, "text": "Ordinal"}, {"num": 2, "text": "Nominal"}, {"num": 3, "text": "Interval"}, {"num": 4, "text": "Ratio"}], "rights": [{"letter": "A", "text": "Eye colour (blue, brown, green)"}, {"letter": "B", "text": "Temperature in degrees Celsius"}, {"letter": "C", "text": "Reaction time in milliseconds"}, {"letter": "D", "text": "Race finishing position (1st, 2nd, 3rd)"}], "answer": {"1": "D", "2": "A", "3": "B", "4": "C"}, "explanation": "Nominal = unordered categories; ordinal = ordered categories without equal spacing; interval = equal spacing but no true zero; ratio = equal spacing with a meaningful zero."}, {"type": "single", "stem": "Which two measurement levels are 'categorical', and which two are 'numerical'?", "options": [{"letter": "A", "text": "Categorical: interval and ratio; numerical: nominal and ordinal"}, {"letter": "B", "text": "Categorical: nominal and ordinal; numerical: interval and ratio"}, {"letter": "C", "text": "Categorical: nominal and interval; numerical: ordinal and ratio"}, {"letter": "D", "text": "Categorical: ordinal and ratio; numerical: nominal and interval"}], "correct": "B", "explanation": "Nominal and ordinal are categorical levels; interval and ratio are numerical levels."}, {"type": "single", "stem": "The distinction between a probability mass function (pmf) and a probability density function (pdf) is that:", "options": [{"letter": "A", "text": "A pmf is used for continuous variables, whereas a pdf is used for discrete outcomes only"}, {"letter": "B", "text": "A pmf is used in R while a pdf is only a theoretical concept"}, {"letter": "C", "text": "A pmf gives probabilities for discrete outcomes; a pdf describes densities for continuous variables"}, {"letter": "D", "text": "A pmf always sums to more than one; a pdf always sums to one"}], "correct": "C", "explanation": "Discrete random variables have a pmf assigning probability to each value; continuous variables have a pdf whose area under the curve gives probability over an interval."}, {"type": "matching", "stem": "Match each R function to what it samples from:", "lefts": [{"num": 1, "text": "runif()"}, {"num": 2, "text": "rnorm()"}, {"num": 3, "text": "rpois()"}, {"num": 4, "text": "sample()"}], "rights": [{"letter": "A", "text": "Poisson distribution (counts)"}, {"letter": "B", "text": "Continuous uniform distribution"}, {"letter": "C", "text": "Draws from a supplied set of values"}, {"letter": "D", "text": "Normal (Gaussian) distribution"}], "answer": {"1": "B", "2": "D", "3": "A", "4": "C"}, "explanation": "runif draws uniform reals, rnorm draws normal values, rpois draws Poisson counts, and sample() draws (with or without replacement) from a given vector."}, {"type": "single", "stem": "What does the difference between a discrete uniform and a continuous uniform distribution come down to?", "options": [{"letter": "A", "text": "The discrete version places equal probability on a finite set of values; the continuous version spreads density evenly over an interval"}, {"letter": "B", "text": "The discrete version has no mean while the continuous version does"}, {"letter": "C", "text": "The discrete version applies only to nominal categorical data, while the continuous version applies only to ratio data"}, {"letter": "D", "text": "The discrete version is skewed while the continuous version is symmetric"}], "correct": "A", "explanation": "Both are 'flat', but discrete uniform assigns equal probability to listed outcomes (e.g. a die), while continuous uniform spreads density evenly across a real interval."}, {"type": "single", "stem": "In the linear model y = b0 + b1*x1 + ... + ε, the term ε represents:", "options": [{"letter": "A", "text": "The total number of predictor variables in the model"}, {"letter": "B", "text": "The slope coefficient linking x1 to the outcome y"}, {"letter": "C", "text": "The intercept, i.e. the value of y when all predictors are zero"}, {"letter": "D", "text": "Random noise (residual error) not explained by the predictors"}], "correct": "D", "explanation": "ε is the error/residual term: the part of y left unexplained by the systematic predictor terms. b0 is the intercept and b1 the slope."}, {"type": "single", "stem": "When simulating data from a linear model, why is the noise term ε added rather than producing y purely from b0 + b1*x1?", "options": [{"letter": "A", "text": "Noise is required for the predictors to be measured on a ratio scale"}, {"letter": "B", "text": "Without noise the points fall exactly on the line, which is unrealistic for real data"}, {"letter": "C", "text": "Adding noise is the only way to make the outcome variable categorical"}, {"letter": "D", "text": "Adding noise is what guarantees that all of the regression coefficients turn out statistically significant"}], "correct": "B", "explanation": "Real measurements scatter around the systematic relationship. Adding ε produces realistic residual variation rather than a perfect deterministic line."}, {"type": "single", "stem": "To include a yes/no predictor such as 'emojis' in a linear model, the lecture uses:", "options": [{"letter": "A", "text": "A Poisson transformation of the categorical predictor"}, {"letter": "B", "text": "Rescaling the categorical predictor linearly onto the interval from zero to one hundred"}, {"letter": "C", "text": "Dummy coding, e.g. the expression emojis == \"yes\" evaluating to 0/1"}, {"letter": "D", "text": "Replacing the predictor with its rank among all observations"}], "correct": "C", "explanation": "A categorical (binary) predictor is dummy-coded into a 0/1 indicator (e.g. emojis==\"yes\"), so it can enter the linear model with its own coefficient."}, {"type": "single", "stem": "The recommended workflow for building a simulation, per the conclusion, is best summarised as:", "options": [{"letter": "A", "text": "Start simple, then add relationships, then make the data more realistic"}, {"letter": "B", "text": "Build the single most realistic model possible first, then strip it back only if it fails"}, {"letter": "C", "text": "Add as much noise as possible before adding any structure"}, {"letter": "D", "text": "Fit the model to real data first, then remove the real data"}], "correct": "A", "explanation": "The practical advice is incremental: begin with a minimal model, layer in relationships among variables, and progressively add realism."}, {"type": "single", "stem": "A simulated 'response length' variable comes out negative for some rows, which is impossible. Which R operation fixes the lower bound?", "options": [{"letter": "A", "text": "sample(value) to reshuffle the values randomly"}, {"letter": "B", "text": "pmin(value, 0) to cap the values at zero"}, {"letter": "C", "text": "pmax(value, 0) to floor the values at zero"}, {"letter": "D", "text": "round(value) to remove the decimal places"}], "correct": "C", "explanation": "pmax(x, 0) replaces any value below zero with zero (an elementwise floor). pmin would instead cap from above; rounding and sampling do not enforce a lower bound."}, {"type": "single", "stem": "The lecture turns a roughly symmetric simulated variable into a right-skewed one by:", "options": [{"letter": "A", "text": "Rounding the values to the nearest integer"}, {"letter": "B", "text": "Taking the logarithm, which removes the skew entirely"}, {"letter": "C", "text": "Sampling the values without replacement"}, {"letter": "D", "text": "Squaring the values, which stretches the upper tail"}], "correct": "D", "explanation": "Squaring positive values inflates large values more than small ones, producing a long right tail (positive skew). Logs typically reduce right skew."}, {"type": "single", "stem": "To convert a continuous simulated variable into a binary outcome, the lecture applies:", "options": [{"letter": "A", "text": "A threshold rule (values above a cut-off become 1, others 0)"}, {"letter": "B", "text": "A uniform rescaling of the variable onto zero to one"}, {"letter": "C", "text": "A Poisson draw based on the variable's mean"}, {"letter": "D", "text": "A normal-distribution transformation centred precisely on the variable's median value"}], "correct": "A", "explanation": "Thresholding maps a continuous value to 0/1 by comparing it to a cut-off, a simple way to create a binary outcome from a numeric variable."}, {"type": "ordering", "stem": "Order the steps of building a logistic-style binary outcome in a simulation:", "items": [{"id": 0, "text": "Use sample() with prob= to draw a 0/1 outcome from that probability"}, {"id": 1, "text": "Compute a linear predictor from the inputs"}, {"id": 2, "text": "Pass the linear predictor through the logistic (sigmoid) link to get a probability"}], "correct_order": [1, 2, 0], "explanation": "The logistic generative recipe: build a linear predictor, squash it to a probability with the sigmoid, then draw a Bernoulli outcome using that probability."}, {"type": "single", "stem": "In the logistic model, the linear predictor is mapped to a probability using the:", "options": [{"letter": "A", "text": "Identity link used in ordinary linear models"}, {"letter": "B", "text": "Logistic (sigmoid) link function"}, {"letter": "C", "text": "Poisson rate parameter of the predictor"}, {"letter": "D", "text": "Square-root transformation of the predictor"}], "correct": "B", "explanation": "The sigmoid maps any real-valued linear predictor into the (0,1) interval, giving a valid probability. The identity link is for ordinary linear regression."}, {"type": "single", "stem": "In a logistic generative model, the intercept primarily controls:", "options": [{"letter": "A", "text": "The baseline (mean) probability when predictors are at their reference values"}, {"letter": "B", "text": "Whether the binary outcome is ultimately treated as nominal or as ordinal"}, {"letter": "C", "text": "The amount of random noise added to the outcome"}, {"letter": "D", "text": "How extreme the predicted probabilities can become"}], "correct": "A", "explanation": "The intercept shifts the whole curve, setting the average probability level; the weights (slopes) govern how steeply and extremely probabilities move."}, {"type": "single", "stem": "In the logistic model, the magnitude of the weights (and the input range) chiefly determines:", "options": [{"letter": "A", "text": "The number of observations in the simulated dataset"}, {"letter": "B", "text": "How extreme the resulting probabilities become (how close to 0 or 1)"}, {"letter": "C", "text": "The baseline average probability obtained when all of the predictors are set to zero"}, {"letter": "D", "text": "Whether the predictors are categorical or numerical"}], "correct": "B", "explanation": "Large weights (or wide input ranges) push the sigmoid toward its flat extremes, producing probabilities near 0 or 1; the intercept sets the baseline level."}, {"type": "single", "stem": "'Log-odds' in the logistic framework refers to:", "options": [{"letter": "A", "text": "The logarithm of the outcome variable's raw value"}, {"letter": "B", "text": "The residual error left after fitting the model"}, {"letter": "C", "text": "The outcome probability multiplied by the natural logarithm of the constant e"}, {"letter": "D", "text": "The logarithm of the odds, which the linear predictor models directly"}], "correct": "D", "explanation": "The logistic linear predictor equals the log-odds (logit) of the outcome; applying the sigmoid converts log-odds back to a probability."}, {"type": "true_false", "stem": "A pdf can take values greater than one, even though probabilities cannot exceed one.", "correct": true, "explanation": "True. A probability density can exceed one because it is a density, not a probability; only the area under the pdf over an interval (which gives the probability) is bounded by one."}, {"type": "true_false", "stem": "sample() in R can only draw values without replacement.", "correct": false, "explanation": "False. sample() supports drawing with or without replacement via its replace argument, and can also draw according to supplied probabilities via prob."}, {"type": "single", "stem": "Which scenario calls for rpois() rather than rnorm()?", "options": [{"letter": "A", "text": "Simulating a participant's height in centimetres"}, {"letter": "B", "text": "Simulating a standardised test score that follows a smooth bell-shaped curve"}, {"letter": "C", "text": "Simulating the count of 'Great question' phrases per chatbot conversation"}, {"letter": "D", "text": "Simulating a continuous latency measured in seconds"}], "correct": "C", "explanation": "Poisson is for non-negative integer counts of events. Continuous quantities like latency, height, or normally-distributed scores suit rnorm() or runif()."}, {"type": "single", "stem": "Why does the lecture advise simulating only what your test or classifier actually needs?", "options": [{"letter": "A", "text": "R cannot simulate more than a few variables at once"}, {"letter": "B", "text": "Extra variables always cause the random seed to change"}, {"letter": "C", "text": "Unnecessary realism adds complexity without improving the evaluation you care about"}, {"letter": "D", "text": "Simulating any extra variables automatically makes the whole dataset categorical by default"}], "correct": "C", "explanation": "A simulation should be just rich enough to stress the method under study; gratuitous detail wastes effort and obscures what is being tested."}, {"type": "single", "stem": "A categorical chatbot variable 'uses emojis' is dummy-coded so that 'yes' = 1 and 'no' = 0, with coefficient b1 = 5 on response length. The interpretation is:", "options": [{"letter": "A", "text": "Conversations that use emojis have, on average, response length 5 units higher"}, {"letter": "B", "text": "The probability that a conversation uses emojis increases by exactly 5 percentage points"}, {"letter": "C", "text": "Conversations that use emojis are 5 times more likely to occur"}, {"letter": "D", "text": "Response length is multiplied by 5 whenever emojis are used"}], "correct": "A", "explanation": "In a linear model with a 0/1 dummy, the coefficient is the additive shift in the outcome for the '1' group relative to the '0' group — here, +5 units."}, {"type": "true_false", "stem": "Interval-scale variables have a meaningful, true zero point, so ratios between values are meaningful.", "correct": false, "explanation": "False. Interval scales (e.g. Celsius) have equal spacing but no true zero, so ratios are not meaningful (20°C is not 'twice as hot' as 10°C). Ratio scales have a true zero."}, {"type": "single", "stem": "What is the role of a random seed (e.g. set.seed()) in a simulation?", "options": [{"letter": "A", "text": "It converts continuous variables into categorical ones"}, {"letter": "B", "text": "It makes the pseudo-random draws reproducible across runs"}, {"letter": "C", "text": "It increases the sample size of the simulated dataset"}, {"letter": "D", "text": "It removes all randomness, making the data deterministic and noise-free"}], "correct": "B", "explanation": "Setting a seed fixes the random-number generator's starting state so the same 'random' values are produced each run, supporting reproducibility — without removing the randomness's statistical character."}, {"type": "single", "stem": "A student claims simulated data prove their method works on real data. The most accurate caution is that:", "options": [{"letter": "A", "text": "Simulations cannot include any categorical variables"}, {"letter": "B", "text": "Real datasets always come with larger sample sizes than any simulation could"}, {"letter": "C", "text": "Simulated data are always noisier than real data"}, {"letter": "D", "text": "Simulations test behaviour under assumptions you chose; real data may violate them"}], "correct": "D", "explanation": "A simulation only probes the scenarios you built in. Strong simulation performance does not guarantee real-world success if the real data-generating process differs from your assumptions."}, {"type": "single", "stem": "Which of the following is NOT a property of a continuous uniform distribution on [a, b]?", "options": [{"letter": "A", "text": "Its density is constant across the interval [a, b]"}, {"letter": "B", "text": "Every sub-interval of equal width carries exactly the same amount of probability"}, {"letter": "C", "text": "It assigns equal probability to each individual real value in the interval"}, {"letter": "D", "text": "The area under its density over [a, b] equals one"}], "correct": "C", "explanation": "For a continuous distribution, any single point has probability zero; only intervals carry probability. Equal probability per individual value is a discrete-uniform property."}, {"type": "single", "stem": "Which transformation would you use to guarantee a simulated proportion stays within [0, 1]?", "options": [{"letter": "A", "text": "Apply rpois() to convert the values into counts"}, {"letter": "B", "text": "Clamp with pmax(pmin(x, 1), 0) so values are floored at 0 and capped at 1"}, {"letter": "C", "text": "Round the values to the nearest whole number"}, {"letter": "D", "text": "Square all of the values in order to stretch out the upper tail of the distribution"}], "correct": "B", "explanation": "Combining pmin (cap at 1) and pmax (floor at 0) forces values into [0,1]. Squaring increases range, Poisson produces counts, and rounding does not bound to [0,1]."}, {"type": "single", "stem": "Within the data-science framing, which task belongs to machine learning rather than inferential statistics?", "options": [{"letter": "A", "text": "Choosing the best classifier to predict a label from features"}, {"letter": "B", "text": "Estimating an unknown population mean together with its confidence interval"}, {"letter": "C", "text": "Reporting a p-value for a regression coefficient"}, {"letter": "D", "text": "Testing whether two group means differ with a t-test"}], "correct": "A", "explanation": "Selecting/optimising a predictive classifier is a machine-learning concern; estimation, hypothesis testing, and p-values are inferential-statistics concerns."}, {"type": "single", "stem": "The 'fake chatbot dataset' includes variables like emoji use, response length, latency, 'Great question' count, and frustration. Which variable is most naturally a count modelled with a Poisson draw?", "options": [{"letter": "A", "text": "The latency of each response in seconds"}, {"letter": "B", "text": "The chatbot-user frustration level measured along a continuous scale"}, {"letter": "C", "text": "Whether the chatbot used emojis (yes or no)"}, {"letter": "D", "text": "The number of 'Great question' phrases per conversation"}], "correct": "D", "explanation": "A tally of phrase occurrences is a non-negative integer count — the natural fit for Poisson. Latency and frustration are continuous; emoji use is binary."}, {"type": "single", "stem": "What is the main reason 'evaluate/compare methods' is listed as a motivation for simulation?", "options": [{"letter": "A", "text": "Known ground truth lets you measure how accurately each method recovers it"}, {"letter": "B", "text": "Methods can only be run on simulated, never real, data"}, {"letter": "C", "text": "Using simulation removes any need to choose tuning parameters for the method"}, {"letter": "D", "text": "Comparison is impossible on benchmark datasets like iris"}], "correct": "A", "explanation": "Because the true parameters are set by the simulator, you can quantify each method's error against the known answer and compare them fairly."}, {"type": "single", "stem": "Which statement about dummy coding is correct?", "options": [{"letter": "A", "text": "Dummy coding turns a numerical predictor into a categorical one"}, {"letter": "B", "text": "Dummy coding requires that the model's outcome variable follow a Poisson distribution"}, {"letter": "C", "text": "A binary categorical predictor becomes a 0/1 indicator entering the model with one coefficient"}, {"letter": "D", "text": "Dummy coding replaces a predictor with its squared values"}], "correct": "C", "explanation": "Dummy coding represents category membership as 0/1 indicators so categorical predictors can be used in a linear/logistic model with associated coefficients."}, {"type": "assertion_reason", "assertion": "In a logistic generative model, increasing the weights on the inputs pushes the simulated probabilities toward 0 and 1.", "reason": "Larger weights make the linear predictor more extreme, and the sigmoid flattens toward 0 or 1 for extreme inputs.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "A", "explanation": "Both true and the reason explains the assertion: bigger weights produce more extreme log-odds, and the sigmoid maps extreme log-odds to probabilities near 0 or 1."}, {"type": "assertion_reason", "assertion": "Squaring a symmetric variable is a good way to remove right skew.", "reason": "Squaring positive values amplifies large values more than small ones.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "D", "explanation": "The reason is true but it shows the assertion is false: amplifying large values introduces right skew rather than removing it; a log transform reduces right skew."}, {"type": "single", "stem": "Which best captures the relationship between RStudio and reproducible research highlighted in the lecture?", "options": [{"letter": "A", "text": "RStudio is a closed proprietary tool whose projects cannot be shared with collaborators"}, {"letter": "B", "text": "RStudio automatically prevents all statistical errors in analyses"}, {"letter": "C", "text": "RStudio replaces the need to set a random seed in simulations"}, {"letter": "D", "text": "RStudio supports literate, reproducible workflows via Markdown/LaTeX integration"}], "correct": "D", "explanation": "RStudio combines code, output, and prose (R Markdown, LaTeX) to make analyses reproducible and shareable; it does not eliminate errors or the need for seeds."}, {"type": "single", "stem": "A simulated latency variable should be continuous and non-negative. The cleanest generative choice is:", "options": [{"letter": "A", "text": "Draw integer event counts with rpois() and then treat those counts as seconds"}, {"letter": "B", "text": "Draw from a positive continuous distribution, then floor any stray values at zero"}, {"letter": "C", "text": "Sample latency without replacement from a fixed small set"}, {"letter": "D", "text": "Dummy-code latency as a 0/1 fast-versus-slow indicator"}], "correct": "B", "explanation": "Latency is continuous and ≥ 0, so a continuous distribution (with a zero floor if needed) fits; Poisson is for counts, and dummy coding/sampling would discard the continuous nature."}, {"type": "single", "stem": "What distinguishes a random variable from an ordinary variable, as introduced in the sampling section?", "options": [{"letter": "A", "text": "A random variable's values are governed by a probability distribution"}, {"letter": "B", "text": "A random variable can only take categorical values"}, {"letter": "C", "text": "A random variable must in every case be measured on a ratio scale"}, {"letter": "D", "text": "A random variable cannot be simulated in R"}], "correct": "A", "explanation": "A random variable maps outcomes to values whose occurrence is described by a probability distribution (pmf or pdf), unlike a fixed/deterministic variable."}, {"type": "single", "stem": "When 'growing the model' from a single predictor to several, what is the main simulation goal?", "options": [{"letter": "A", "text": "To guarantee in advance that the fitted regression comes out statistically significant"}, {"letter": "B", "text": "To es that ground truth."}, {"type": "single", "stem": "A researcher wants the average probability of an event to be about 0.2 across simulated cases. In a logistic generative model, they should mainly adjust:", "options": [{"letter": "A", "text": "The weights, to control how extreme probabilities become"}, {"letter": "B", "text": "The number of predictors in the linear part"}, {"letter": "C", "text": "The intercept, to set the baseline probability level"}, {"letter": "D", "text": "The noise variance of the outcome variable"}], "correct": "C", "explanation": "The intercept shifts the sigmoid to set the baseline/mean probability; weights govern steepness/extremeness, not the overall level."}, {"type": "single", "stem": "Which of the following is NOT a numerical measurement level?", "options": [{"letter": "A", "text": "Ordinal"}, {"letter": "B", "text": "Interval"}, {"letter": "C", "text": "Ratio"}, {"letter": "D", "text": "Counts measured on a ratio scale"}], "correct": "A", "explanation": "Interval and ratio are numerical; ordinal is a categorical (ordered) level. Counts measured on a ratio scale are numerical/ratio."}, {"type": "single", "stem": "Which sequence correctly describes simulating a realistic right-skewed, non-negative count-like score?", "options": [{"letter": "A", "text": "Square a categorical dummy variable to make it numeric"}, {"letter": "B", "text": "Generate from a suitable distribution, transform to induce skew, then floor at zero"}, {"letter": "C", "text": "Floor everything at zero first, then draw fresh values from a normal distribution centred there"}, {"letter": "D", "text": "Sample without replacement from a uniform set of integers"}], "correct": "B", "explanation": "You build the base values, apply a transformation (e.g. squaring) to introduce skew, and enforce the non-negativity constraint with a floor — matching the recoding/transformation toolkit."}, {"type": "single", "stem": "What is the upcoming topic the lecture says follows data simulation?", "options": [{"letter": "A", "text": "Open and reproducible research practices"}, {"letter": "B", "text": "Data collection methods together with SMART research proposals"}, {"letter": "C", "text": "Research ethics and the EU AI Act"}, {"letter": "D", "text": "Classification, inference, performance, and p-values"}], "correct": "D", "explanation": "The conclusion previews next week as classification, inference, performance, and p-values — i.e. the data-analysis lecture."}]}</script>
<script>
"use strict";
var QUIZ = JSON.parse(document.getElementById("quiz-data").textContent);
var submitted = false;
document.getElementById("title").textContent = QUIZ.title;
document.title = QUIZ.title;

function elem(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function radioOpt(name, value, labelText, bare) {
  var id = name + "_" + value;
  var input = elem("input", { type: "radio", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("span", bare ? {} : { class: "opt" }, [input, label]);
}
function checkOpt(name, value, labelText) {
  var id = name + "_" + value;
  var input = elem("input", { type: "checkbox", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("div", { class: "opt" }, [input, label]);
}

function buildQuestion(q, idx) {
  var card = elem("div", { class: "q", id: "q" + idx });
  var name = "q" + idx;
  if (q.type === "assertion_reason") {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + "." }));
    var a = elem("p", { class: "ar-line" });
    a.appendChild(elem("strong", { text: "Assertion: " }));
    a.appendChild(document.createTextNode(q.assertion));
    card.appendChild(a);
    var r = elem("p", { class: "ar-line" });
    r.appendChild(elem("strong", { text: "Reason: " }));
    r.appendChild(document.createTextNode(q.reason));
    card.appendChild(r);
  } else {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + ". " + (q.stem || "") }));
  }

  if (q.type === "single" || q.type === "assertion_reason") {
    var fs = elem("fieldset");
    fs.appendChild(elem("legend", { text: "Choose one answer" }));
    q.options.forEach(function (o) {
      fs.appendChild(radioOpt(name, o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fs);
  } else if (q.type === "true_false") {
    var fs2 = elem("fieldset");
    fs2.appendChild(elem("legend", { text: "True or False" }));
    fs2.appendChild(radioOpt(name, "true", "True"));
    fs2.appendChild(radioOpt(name, "false", "False"));
    card.appendChild(fs2);
  } else if (q.type === "multi") {
    card.appendChild(elem("p", { class: "right-col", text: "Select all that apply." }));
    q.options.forEach(function (o) {
      card.appendChild(checkOpt(name, o.letter, o.letter + ") " + o.text));
    });
  } else if (q.type === "mtf") {
    q.statements.forEach(function (s, j) {
      var sname = name + "_s" + j;
      var row = elem("div", { class: "stmt" });
      row.appendChild(elem("span", { class: "stmt-text", text: (j + 1) + ". " + s.text }));
      var tf = elem("span", { class: "stmt-tf" }, [
        radioOpt(sname, "true", "True", true),
        radioOpt(sname, "false", "False", true)
      ]);
      row.appendChild(tf);
      card.appendChild(row);
    });
  } else if (q.type === "two_tier") {
    var fsa = elem("fieldset");
    fsa.appendChild(elem("legend", { text: "Tier 1" }));
    q.tier1.options.forEach(function (o) {
      fsa.appendChild(radioOpt(name + "_t1", o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fsa);
    var tier = elem("div", { class: "tier" });
    tier.appendChild(elem("div", { class: "tier-q", text: q.tier2.stem }));
    var fsb = elem("fieldset");
    fsb.appendChild(elem("legend", { text: "Tier 2" }));
    q.tier2.options.forEach(function (o) {
      fsb.appendChild(radioOpt(name + "_t2", o.letter, o.letter + ") " + o.text));
    });
    tier.appendChild(fsb);
    card.appendChild(tier);
  } else if (q.type === "matching") {
    var tbl = elem("table", { class: "match" });
    q.lefts.forEach(function (l) {
      var sel = elem("select", { id: name + "_l" + l.num, "aria-label": "Match for " + l.text });
      sel.appendChild(elem("option", { value: "", text: "—" }));
      q.rights.forEach(function (rr) {
        sel.appendChild(elem("option", { value: rr.letter, text: rr.letter }));
      });
      var td1 = elem("td", { text: l.num + ". " + l.text });
      var td2 = elem("td", null, [sel]);
      tbl.appendChild(elem("tr", null, [td1, td2]));
    });
    card.appendChild(tbl);
    var rl = elem("div", { class: "right-col" }, [elem("p", { text: "Options:" })]);
    q.rights.forEach(function (rr) {
      rl.appendChild(elem("div", { text: rr.letter + ") " + rr.text }));
    });
    card.appendChild(rl);
  } else if (q.type === "ordering") {
    var n = q.items.length;
    card.appendChild(elem("p", { class: "right-col", text: "Assign each item a position (1 = first)." }));
    q.items.forEach(function (it) {
      var row = elem("div", { class: "li-pos" });
      var sel = elem("select", { id: name + "_pos" + it.id, "aria-label": "Position for " + it.text });
      sel.appendChild(elem("option", { value: "", text: "#" }));
      for (var p = 1; p <= n; p++) sel.appendChild(elem("option", { value: String(p), text: String(p) }));
      row.appendChild(sel);
      row.appendChild(elem("span", { class: "li-text", text: it.text }));
      card.appendChild(row);
    });
  }

  card.appendChild(elem("div", { class: "feedback", id: name + "_fb" }));
  return card;
}

function getRadio(name) {
  var r = document.querySelector('input[name="' + name + '"]:checked');
  return r ? r.value : null;
}

function gradeQuestion(q, idx) {
  var name = "q" + idx;
  var correct = false;
  var ansText = "";
  if (q.type === "single" || q.type === "assertion_reason") {
    correct = getRadio(name) === q.correct;
    ansText = "Correct answer: " + q.correct;
  } else if (q.type === "true_false") {
    correct = (getRadio(name) === "true") === q.correct;
    ansText = "Correct answer: " + (q.correct ? "True" : "False");
  } else if (q.type === "multi") {
    var chosen = Array.prototype.slice.call(
      document.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function (c) { return c.value; }).sort();
    var key = q.correct.slice().sort();
    correct = chosen.length === key.length && chosen.every(function (v, i) { return v === key[i]; });
    ansText = "Correct selection: " + key.join(", ");
  } else if (q.type === "mtf") {
    var all = true; var parts = [];
    q.statements.forEach(function (s, j) {
      var ok = (getRadio(name + "_s" + j) === "true") === s.answer;
      if (!ok) all = false;
      parts.push((j + 1) + ": " + (s.answer ? "True" : "False"));
      var row = document.querySelectorAll("#q" + idx + " .stmt")[j];
      if (row) row.appendChild(elem("span", { class: "mark " + (ok ? "ok" : "no"), text: ok ? "✓" : "✗" }));
    });
    correct = all;
    ansText = "Correct: " + parts.join(", ");
  } else if (q.type === "two_tier") {
    correct = getRadio(name + "_t1") === q.tier1.correct && getRadio(name + "_t2") === q.tier2.correct;
    ansText = "Correct: tier 1 = " + q.tier1.correct + ", tier 2 = " + q.tier2.correct;
  } else if (q.type === "matching") {
    var allm = true; var parts2 = [];
    q.lefts.forEach(function (l) {
      var sel = document.getElementById(name + "_l" + l.num);
      var want = q.answer[String(l.num)];
      if (!sel || sel.value !== want) allm = false;
      parts2.push(l.num + "→" + want);
    });
    correct = allm;
    ansText = "Correct matches: " + parts2.join(", ");
  } else if (q.type === "ordering") {
    var placed = [];
    q.items.forEach(function (it) {
      var sel = document.getElementById(name + "_pos" + it.id);
      placed.push({ id: it.id, pos: sel ? parseInt(sel.value, 10) : NaN });
    });
    placed.sort(function (a, b) { return a.pos - b.pos; });
    var seq = placed.map(function (p) { return p.id; });
    correct = seq.length === q.correct_order.length &&
              seq.every(function (v, i) { return v === q.correct_order[i]; });
    var byId = {}; q.items.forEach(function (it) { byId[it.id] = it.text; });
    ansText = "Correct order: " + q.correct_order.map(function (id, i) {
      return (i + 1) + ". " + byId[id]; }).join("  |  ");
  }

  var card = document.getElementById("q" + idx);
  card.classList.remove("correct", "incorrect");
  card.classList.add(correct ? "correct" : "incorrect");
  var fb = document.getElementById(name + "_fb");
  fb.innerHTML = "";
  fb.appendChild(elem("div", { class: "verdict " + (correct ? "ok" : "no"),
    text: correct ? "Correct" : "Incorrect" }));
  fb.appendChild(elem("div", { class: "ans", text: ansText }));
  if (q.explanation) fb.appendChild(elem("div", { class: "expl", text: q.explanation }));
  fb.classList.add("show");
  return correct;
}

function checkAll() {
  if (submitted) return;
  submitted = true;
  var score = 0;
  QUIZ.questions.forEach(function (q, i) { if (gradeQuestion(q, i)) score++; });
  document.getElementById("score").textContent = "Score: " + score + " / " + QUIZ.questions.length;
  document.getElementById("check").disabled = true;
}

function reset() {
  submitted = false;
  document.getElementById("check").disabled = false;
  document.getElementById("score").textContent = "";
  document.getElementById("quiz").innerHTML = "";
  buildAll();
}

function buildAll() {
  var container = document.getElementById("quiz");
  QUIZ.questions.forEach(function (q, i) { container.appendChild(buildQuestion(q, i)); });
}

document.getElementById("check").addEventListener("click", checkAll);
document.getElementById("reset").addEventListener("click", reset);
buildAll();
</script>
</body>
</html>
