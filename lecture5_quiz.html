<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WG106 — Lecture 5: Open &amp; Reproducible Research</title>
<style>
  :root { --ok:#1a7f37; --okbg:#e8f5ec; --bad:#cf222e; --badbg:#fbe9ea;
          --line:#d0d7de; --muted:#57606a; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.5; color: #1f2328; margin: 0; padding: 1.5rem 1rem 5rem;
         background: #f6f8fa; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .q { background: #fff; border: 1px solid var(--line); border-radius: 10px;
       padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .q.correct { border-color: var(--ok); background: var(--okbg); }
  .q.incorrect { border-color: var(--bad); background: var(--badbg); }
  .stem { margin: 0 0 0.75rem; font-weight: 600; }
  .ar-line { margin: 0.15rem 0; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.3rem 0.4rem;
         border-radius: 6px; }
  .opt:hover { background: rgba(9,105,218,0.06); }
  .opt input { margin-top: 0.3rem; }
  .opt label { cursor: pointer; flex: 1; }
  .tier { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); }
  .tier-q { font-weight: 600; margin-bottom: 0.4rem; }
  .stmt { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.4rem 0;
          border-bottom: 1px solid #f0f0f0; }
  .stmt-text { flex: 1; }
  .stmt-tf label { margin-left: 0.6rem; }
  .mark { font-weight: 700; margin-left: 0.4rem; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--bad); }
  table.match { width: 100%; border-collapse: collapse; }
  table.match td { padding: 0.35rem 0.4rem; vertical-align: top; }
  .right-col { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
  select { padding: 0.25rem; border: 1px solid var(--line); border-radius: 6px;
           font-size: 0.95rem; background: #fff; }
  .feedback { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px;
              background: #fff; border: 1px solid var(--line); display: none; }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.ok { color: var(--ok); }
  .feedback .verdict.no { color: var(--bad); }
  .feedback .ans { margin-top: 0.3rem; }
  .feedback .expl { margin-top: 0.3rem; color: var(--muted); }
  .bar { position: sticky; bottom: 0; background: #f6f8fa; padding: 0.75rem 0;
         display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #score { font-weight: 700; font-size: 1.1rem; }
  .li-pos { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
  .li-pos .li-text { flex: 1; }
</style>
</head>

  <h1 id="title"></h1>

    <button id="check">Check answers</button>

</main>
<script id="quiz-data" type="application/json">{"title": "WG106 — Lecture 5: Open & Reproducible Research", "questions": [{"type": "single", "stem": "In the lecture's terminology, computational reproducibility means:", "options": [{"letter": "A", "text": "Collecting an entirely new sample of data and obtaining the same overall conclusion"}, {"letter": "B", "text": "Two independent labs designing studies on the same question"}, {"letter": "C", "text": "Re-running the same data through the same procedures yields the same results"}, {"letter": "D", "text": "Sharing the manuscript openly before peer review begins"}], "correct": "C", "explanation": "Computational reproducibility = same data + same code/procedures → same results. Using new data to reach the same conclusion is replication, a different concept."}, {"type": "single", "stem": "Replication, as distinguished from reproducibility, refers to:", "options": [{"letter": "A", "text": "Publishing the dataset alongside the analysis scripts"}, {"letter": "B", "text": "Following the same procedure on new data to test whether the finding holds"}, {"letter": "C", "text": "Re-analysing the original data with the original code"}, {"letter": "D", "text": "Submitting one and the same paper to several different journals at once"}], "correct": "B", "explanation": "Replication collects fresh data using the same method; reproducibility re-uses the original data and procedures. They answer different questions about robustness."}, {"type": "matching", "stem": "Match each term to its meaning:", "lefts": [{"num": 1, "text": "Open data"}, {"num": 2, "text": "Reproducibility"}, {"num": 3, "text": "Replication"}, {"num": 4, "text": "Computational reproducibility"}], "rights": [{"letter": "A", "text": "Same procedure, new data"}, {"letter": "B", "text": "Same data + same procedures → same results"}, {"letter": "C", "text": "Sharing data, code, and materials"}, {"letter": "D", "text": "Umbrella term for re-obtaining results"}], "answer": {"1": "C", "2": "D", "3": "A", "4": "B"}, "explanation": "Reproducibility is the broad umbrella; its computational form fixes data and procedures; replication varies the data; open data concerns making materials available."}, {"type": "single", "stem": "Wicherts (2006) and Vanpaemel (2015) are cited primarily to document:", "options": [{"letter": "A", "text": "The environmental cost of training machine-learning models"}, {"letter": "B", "text": "The discovery of widespread data fabrication in psychology"}, {"letter": "C", "text": "The success rate of large-scale replication projects"}, {"letter": "D", "text": "High rates of non-compliance with data-sharing requests"}], "correct": "D", "explanation": "These studies found that, when authors are asked to share their data, a large fraction do not — evidencing low data-sharing compliance."}, {"type": "single", "stem": "Which of the following is NOT given as a reason researchers decline to share their data?", "options": [{"letter": "A", "text": "Sharing data is prohibited by every major scientific journal"}, {"letter": "B", "text": "Fear of being scooped or having errors exposed"}, {"letter": "C", "text": "Copyright or proprietary constraints on the data"}, {"letter": "D", "text": "The substantial effort required to properly clean and fully document the data"}], "correct": "A", "explanation": "Reasons include proprietary/copyright limits, fear of scrutiny/scooping, and effort. The claim that journals prohibit sharing is false — Nature and Science increasingly require it."}, {"type": "single", "stem": "Statcheck is a tool designed to:", "options": [{"letter": "A", "text": "Reproduce the authors' analyses by re-running their original analysis code"}, {"letter": "B", "text": "Generate synthetic datasets for method testing"}, {"letter": "C", "text": "Detect plagiarism across submitted manuscripts"}, {"letter": "D", "text": "Automatically check whether reported statistics are internally consistent"}], "correct": "D", "explanation": "Statcheck recomputes p-values from reported test statistics and degrees of freedom to flag inconsistencies — a way to assess reproducibility without the raw data."}, {"type": "single", "stem": "GRIM and SPRITE (Brown & Heathers, 2017) are techniques that:", "options": [{"letter": "A", "text": "Anonymise sensitive datasets thoroughly before they are released to the public"}, {"letter": "B", "text": "Test whether reported summary statistics are even possible given the sample size"}, {"letter": "C", "text": "Re-execute the authors' analysis scripts end to end"}, {"letter": "D", "text": "Measure the carbon footprint of a computation"}], "correct": "B", "explanation": "GRIM/SPRITE check the numerical plausibility of reported means/SDs given integer data and sample size, catching impossible or implausible values without the original data."}, {"type": "matching", "stem": "Match each literate-programming or reproducibility tool to its role:", "lefts": [{"num": 1, "text": "GRIM / SPRITE"}, {"num": 2, "text": "Statcheck"}, {"num": 3, "text": "Jupyter"}, {"num": 4, "text": "R Markdown / Quarto"}], "rights": [{"letter": "A", "text": "Checks consistency of reported statistics"}, {"letter": "B", "text": "Notebook combining code, output, and prose"}, {"letter": "C", "text": "Literate documents that regenerate results from code"}, {"letter": "D", "text": "Checks plausibility of reported summary numbers"}], "answer": {"1": "D", "2": "A", "3": "B", "4": "C"}, "explanation": "Literate programming (Jupyter, R Markdown, Quarto) weaves code and narrative for reproducibility; statcheck and GRIM/SPRITE audit reported numbers post hoc."}, {"type": "single", "stem": "The Open Science Collaboration (2015) is best known for:", "options": [{"letter": "A", "text": "A large-scale attempt to replicate many psychology findings, with low success"}, {"letter": "B", "text": "The creation of the statcheck consistency-checking tool"}, {"letter": "C", "text": "A study of the carbon cost of model training"}, {"letter": "D", "text": "A survey reporting that most scientists actively distrust the peer-review system"}], "correct": "A", "explanation": "The 2015 collaboration tried to replicate ~100 psychology studies and found a low replication rate, a landmark in the 'replication crisis' discussion."}, {"type": "single", "stem": "A 2016 Nature survey is cited in the lecture to convey that:", "options": [{"letter": "A", "text": "Replication studies are now more common than original studies"}, {"letter": "B", "text": "AI-written research papers are now completely indistinguishable from human-written ones"}, {"letter": "C", "text": "Many researchers across fields perceive a reproducibility/replication crisis"}, {"letter": "D", "text": "Most journals require open data as a condition of submission"}], "correct": "C", "explanation": "The Nature 2016 survey found widespread agreement among scientists that there is a reproducibility crisis, motivating the lecture's reforms discussion."}, {"type": "single", "stem": "Which of the following is NOT listed as an explanation for replication failures?", "options": [{"letter": "A", "text": "Questionable research practices (QRPs)"}, {"letter": "B", "text": "Mandatory pre-registration of every published study"}, {"letter": "C", "text": "Outright fraud in a minority of cases"}, {"letter": "D", "text": "Incomplete reporting of methods and poor computational reproducibility"}], "correct": "B", "explanation": "Explanations include fraud, QRPs, incomplete reporting, and poor reproducibility. Pre-registration is a proposed solution, not a cause of failures."}, {"type": "matching", "stem": "Match each data split to its purpose in CS/AI work:", "lefts": [{"num": 1, "text": "Validation set"}, {"num": 2, "text": "Training set"}, {"num": 3, "text": "Test set"}], "rights": [{"letter": "A", "text": "Estimate final unbiased performance"}, {"letter": "B", "text": "Tune hyperparameters and select models"}, {"letter": "C", "text": "Fit the model's parameters"}], "answer": {"1": "B", "2": "C", "3": "A"}, "explanation": "Train fits parameters, validation guides tuning/selection, and the held-out test set gives an unbiased final performance estimate."}, {"type": "single", "stem": "Data leakage in a machine-learning pipeline occurs when:", "options": [{"letter": "A", "text": "Information from the test set improperly influences training or feature choices"}, {"letter": "B", "text": "The reported summary statistics turn out inconsistent with the underlying test statistics"}, {"letter": "C", "text": "A confounding variable causes a spurious correlation"}, {"letter": "D", "text": "The dataset is too small to split into three parts"}], "correct": "A", "explanation": "Leakage is when test-time information bleeds into training (e.g. scaling using test data), inflating performance estimates and harming reproducibility."}, {"type": "single", "stem": "Gundersen & Kjensmo (2018) and Simkó are cited in connection with:", "options": [{"letter": "A", "text": "The first large-scale replication project carried out in psychology"}, {"letter": "B", "text": "Copyright disputes over training data"}, {"letter": "C", "text": "Documentation gaps that make AI research hard to reproduce"}, {"letter": "D", "text": "Tools for checking statistical consistency"}], "correct": "C", "explanation": "These works assess how much AI papers report (code, data, settings) and find documentation gaps that impede reproducibility."}, {"type": "single", "stem": "Non-determinism in AI experiments (e.g. random seeds) threatens reproducibility because:", "options": [{"letter": "A", "text": "Random seeds permanently corrupt the training dataset"}, {"letter": "B", "text": "Seeds convert a classification task into a regression one"}, {"letter": "C", "text": "Non-determinism affects only the validation split and never touches model training at all"}, {"letter": "D", "text": "The same code can give different results across runs unless seeds are controlled"}], "correct": "D", "explanation": "Stochastic elements (initialisation, shuffling, GPU non-determinism) make runs differ; fixing seeds — and reporting performance averaged across seeds — improves reproducibility."}, {"type": "single", "stem": "Seed averaging is recommended because:", "options": [{"letter": "A", "text": "It automatically increases the overall size of the available training set"}, {"letter": "B", "text": "It guarantees the model will never overfit the data"}, {"letter": "C", "text": "Reporting performance over several seeds reflects variability rather than one lucky run"}, {"letter": "D", "text": "It removes the need to keep any held-out test data"}], "correct": "C", "explanation": "Averaging across multiple random seeds (and reporting spread) gives a more honest, reproducible estimate than a single, possibly cherry-picked, run."}, {"type": "ordering", "stem": "Order the typical stages of getting a paper published, as presented:", "items": [{"id": 0, "text": "Peer review of the manuscript"}, {"id": 1, "text": "Revision and response to reviewers"}, {"id": 2, "text": "Identify a suitable outlet (journal/venue)"}, {"id": 3, "text": "Editor assesses fit (possible desk reject) and finds reviewers"}, {"id": 4, "text": "Editorial decision (accept/revise/reject)"}], "correct_order": [2, 3, 0, 4, 1], "explanation": "The five steps: choose an outlet → editorial fit check → peer review → editorial decision → revision/rebuttal. A desk reject can end it at step 2."}, {"type": "single", "stem": "A 'desk reject' refers to:", "options": [{"letter": "A", "text": "A journal retracting a paper after publication"}, {"letter": "B", "text": "An editor rejecting a submission without sending it out for peer review"}, {"letter": "C", "text": "An author withdrawing the paper before submission"}, {"letter": "D", "text": "A reviewer recommending rejection only after a thorough, careful read"}], "correct": "B", "explanation": "Desk rejection happens at the editorial-fit stage: the editor decides the paper is unsuitable and declines it before peer review."}, {"type": "matching", "stem": "Match each peer-review blinding scheme to its description:", "lefts": [{"num": 1, "text": "Open / no blinding"}, {"num": 2, "text": "Double-blind"}, {"num": 3, "text": "Single-blind"}], "rights": [{"letter": "A", "text": "Reviewers know authors; authors do not know reviewers"}, {"letter": "B", "text": "Identities of both parties are known"}, {"letter": "C", "text": "Neither authors nor reviewers know each other's identity"}], "answer": {"1": "B", "2": "C", "3": "A"}, "explanation": "Single-blind hides reviewer identity only; double-blind hides both; open review reveals both — each with different bias and accountability trade-offs."}, {"type": "single", "stem": "Publication bias (the 'file-drawer' problem) means that:", "options": [{"letter": "A", "text": "Significant, positive results are more likely to be published than null results"}, {"letter": "B", "text": "Reviewers are systematically harsher on junior authors"}, {"letter": "C", "text": "Editors reject papers because of formatting errors"}, {"letter": "D", "text": "Datasets are physically lost because they end up stored in old filing cabinets"}], "correct": "A", "explanation": "Studies with null/negative findings tend to remain unpublished ('in the file drawer'), biasing the literature toward positive effects."}, {"type": "single", "stem": "A 'rebuttal letter' in the revision stage is:", "options": [{"letter": "A", "text": "A reviewer's confidential recommendation submitted privately to the handling editor"}, {"letter": "B", "text": "A retraction notice issued after publication"}, {"letter": "C", "text": "The editor's formal notice of a desk rejection"}, {"letter": "D", "text": "The authors' point-by-point response to reviewers' comments"}], "correct": "D", "explanation": "When revising, authors submit a rebuttal/response letter addressing each reviewer comment, alongside the revised manuscript."}, {"type": "true_false", "stem": "Reproducibility and replication are interchangeable terms for the same procedure.", "correct": false, "explanation": "False. Reproducibility (especially computational) re-uses the same data and procedures; replication runs the same procedure on new data. They test different things."}, {"type": "true_false", "stem": "Statcheck and GRIM/SPRITE can flag problems in a paper even without access to the underlying raw data.", "correct": true, "explanation": "True. Both audit reported numbers (statistic consistency; plausibility of means/SDs) using only what is printed in the paper, so raw data are not required."}, {"type": "single", "stem": "Why are NeurIPS and AAAI reproducibility checklists relevant to this lecture?", "options": [{"letter": "A", "text": "They explicitly forbid the use of any open-source software anywhere in submissions"}, {"letter": "B", "text": "They mandate that all experiments use a single random seed"}, {"letter": "C", "text": "They push AI venues to require disclosure of code, data, and settings"}, {"letter": "D", "text": "They replace peer review with automated statistical checks"}], "correct": "C", "explanation": "Major AI conferences adopted checklists to improve reporting and reproducibility, paralleling journal data-sharing requirements in other fields."}, {"type": "single", "stem": "Which scenario is a reproducibility failure rather than a replication failure?", "options": [{"letter": "A", "text": "A meta-analysis finds the effect shrinks across studies"}, {"letter": "B", "text": "A new sample fails to show the originally reported effect"}, {"letter": "C", "text": "A second independent lab cannot obtain the same effect using fresh participants"}, {"letter": "D", "text": "Re-running the authors' shared code on their data yields different numbers"}], "correct": "D", "explanation": "Same data + same code giving different results is a (computational) reproducibility failure. The others involve new data, hence replication."}, {"type": "single", "stem": "Constructive peer-review feedback differs from destructive feedback chiefly in that it:", "options": [{"letter": "A", "text": "It always recommends acceptance regardless of the actual quality of the paper"}, {"letter": "B", "text": "Identifies problems while offering actionable ways to improve the work"}, {"letter": "C", "text": "Focuses on the authors' reputation rather than the manuscript"}, {"letter": "D", "text": "Is delivered only by the editor and never by reviewers"}], "correct": "B", "explanation": "Constructive reviews critique specifics and suggest improvements; destructive 'Reviewer 2'-style feedback is harsh or dismissive without helping the authors improve."}, {"type": "single", "stem": "Predatory journals and paper mills are concerns at which stage?", "options": [{"letter": "A", "text": "Identifying a suitable outlet for the paper"}, {"letter": "B", "text": "Re-running analyses for computational reproducibility"}, {"letter": "C", "text": "Writing the rebuttal letter to reviewers"}, {"letter": "D", "text": "Conducting the peer review of the manuscript"}], "correct": "A", "explanation": "Choosing where to submit is where predatory journals (charging fees with little review) and paper mills (selling authorship) become a risk."}, {"type": "single", "stem": "Which of the following is NOT a proposed solution to the replication crisis discussed in the lecture?", "options": [{"letter": "A", "text": "Stronger reporting and peer-review standards"}, {"letter": "B", "text": "Better training in methods and statistics"}, {"letter": "C", "text": "Eliminating the test set so all data can be used for training"}, {"letter": "D", "text": "Improving the incentive structures so that replication and null results are valued"}], "correct": "C", "explanation": "Solutions include incentives, training, and reporting/review standards. Removing the test set would worsen, not solve, reproducibility problems."}, {"type": "single", "stem": "Why does the lecture flag genAI and hidden prompt injections within peer review?", "options": [{"letter": "A", "text": "GenAI guarantees that reviews are free of bias"}, {"letter": "B", "text": "Reviewers or authors may misuse AI, and hidden text can manipulate AI-assisted review"}, {"letter": "C", "text": "Prompt injection increases the reproducibility of experiments"}, {"letter": "D", "text": "AI reviewing tools have now entirely replaced human reviewers at most major journals"}], "correct": "B", "explanation": "The lecture notes the growing role of genAI in review and the risk of hidden prompt injections (text crafted to steer an AI reviewer), an emerging integrity threat."}, {"type": "single", "stem": "Ioannidis (2009) on genetics is used as a field example of:", "options": [{"letter": "A", "text": "The creation of literate-programming tools"}, {"letter": "B", "text": "A famously successful large-scale replication effort in psychology"}, {"letter": "C", "text": "Predatory publishing in open-access journals"}, {"letter": "D", "text": "Difficulties reproducing results within a scientific field"}], "correct": "D", "explanation": "Ioannidis's genetics example illustrates reproducibility problems in practice, supporting the broader argument that re-obtaining results is often hard."}, {"type": "single", "stem": "Which best explains why class imbalance is a metric issue relevant to reproducible AI reporting?", "options": [{"letter": "A", "text": "Reporting only accuracy can hide poor minority-class performance, misleading readers"}, {"letter": "B", "text": "Imbalance makes random seeds impossible to set"}, {"letter": "C", "text": "Imbalance prevents any train/validation/test split"}, {"letter": "D", "text": "Severe class imbalance always causes data leakage between the data splits"}], "correct": "A", "explanation": "Under imbalance, headline accuracy can look strong while precision/recall on the rare class are poor; transparent reporting needs more than accuracy."}, {"type": "true_false", "stem": "Replication studies are relatively rare partly because of reputational, cost, and feasibility barriers.", "correct": true, "explanation": "True. The lecture notes that replications are uncommon because they are costly, less rewarded reputationally, and sometimes infeasible to carry out."}, {"type": "single", "stem": "Literate programming (e.g. R Markdown) supports reproducibility mainly by:", "options": [{"letter": "A", "text": "Replacing statistical tests with narrative description"}, {"letter": "B", "text": "Binding code, outputs, and explanation so results regenerate from source"}, {"letter": "C", "text": "Automatically recruiting reviewers for the paper"}, {"letter": "D", "text": "Encrypting the entire dataset so that only the original authors can read it"}], "correct": "B", "explanation": "Literate documents keep code and narrative together so anyone can re-run them and regenerate the reported outputs, reducing manual transcription errors."}, {"type": "single", "stem": "A reviewer who delays a paper to publish a similar idea first is engaging in:", "options": [{"letter": "A", "text": "Editorial desk rejection of a clearly unsuitable submission"}, {"letter": "B", "text": "Double-blind reviewing of the manuscript"}, {"letter": "C", "text": "Scooping, a recognised peer-review integrity problem"}, {"letter": "D", "text": "Computational reproducibility checking"}], "correct": "C", "explanation": "Scooping (exploiting privileged access to a manuscript to pre-empt it) is a known abuse of the reviewing role the lecture flags."}, {"type": "single", "stem": "Underspecification in machine-learning pipelines refers to:", "options": [{"letter": "A", "text": "Many models fit the training data equally well yet behave differently out of distribution"}, {"letter": "B", "text": "The paper's reported statistics turning out to be internally inconsistent"}, {"letter": "C", "text": "The test set leaking into the training set"}, {"letter": "D", "text": "The dataset being too small to train any model"}], "correct": "A", "explanation": "Underspecification means the training criterion does not pin down a unique solution, so equally good-on-paper models diverge in real-world behaviour — a reproducibility concern."}, {"type": "assertion_reason", "assertion": "Sharing analysis code alongside a paper improves computational reproducibility.", "reason": "With the original code and data, others can re-run the analysis and obtain the same results.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "A", "explanation": "Both true and the reason explains the assertion: open code plus data is exactly what lets others reproduce the same results from the same inputs."}, {"type": "assertion_reason", "assertion": "A high replication rate was found in the Open Science Collaboration (2015) project.", "reason": "Replication is rare because it is costly and offers little reputational reward.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "D", "explanation": "The assertion is false — the 2015 project found a low replication rate. The reason (replication is rare and under-rewarded) is true but does not rescue the false assertion."}, {"type": "single", "stem": "Which pairing of stage and risk is correct?", "options": [{"letter": "A", "text": "Peer review → desk rejection; outlet choice → rebuttal letter"}, {"letter": "B", "text": "Editorial decision → finding reviewers; revision → desk rejection"}, {"letter": "C", "text": "Outlet choice → the file-drawer effect; peer review stage → predatory journals"}, {"letter": "D", "text": "Identifying an outlet → predatory journals; revision → rebuttal letter"}], "correct": "D", "explanation": "Predatory journals are an outlet-choice risk; the rebuttal letter belongs to revision. Desk rejection and finding reviewers occur at the editorial-fit stage."}, {"type": "single", "stem": "A team reports only the seed that gave their best accuracy. The most accurate criticism is that this:", "options": [{"letter": "A", "text": "Renders the reported result computationally non-reproducible essentially by definition"}, {"letter": "B", "text": "Is a form of predatory publishing behaviour"}, {"letter": "C", "text": "Cherry-picks a lucky run and overstates reproducible performance"}, {"letter": "D", "text": "Causes data leakage from the test set into training"}], "correct": "C", "explanation": "Selecting the best of many seeds inflates the reported result; reporting across seeds (seed averaging) with variability is the reproducible practice."}, {"type": "single", "stem": "Which is the clearest case where open data is constrained for legitimate reasons?", "options": [{"letter": "A", "text": "The dataset contains proprietary or copyrighted material that cannot be redistributed"}, {"letter": "B", "text": "The authors simply prefer not to be checked by others"}, {"letter": "C", "text": "Sharing data would make replication impossible"}, {"letter": "D", "text": "The chosen journal explicitly forbids absolutely any form of data sharing"}], "correct": "A", "explanation": "Copyright/proprietary constraints are a legitimate barrier to open data. Avoiding scrutiny is not legitimate, journals increasingly require sharing, and openness aids (not blocks) replication."}, {"type": "single", "stem": "Which of the following is NOT a literate-programming environment named in the lecture?", "options": [{"letter": "A", "text": "R Markdown"}, {"letter": "B", "text": "Quarto"}, {"letter": "C", "text": "Jupyter"}, {"letter": "D", "text": "Statcheck"}], "correct": "D", "explanation": "Jupyter, R Markdown, and Quarto are literate-programming tools. Statcheck is a statistics-consistency checker, not a literate-programming environment."}, {"type": "single", "stem": "Why does incomplete reporting of methods undermine replication specifically?", "options": [{"letter": "A", "text": "It affects only computational reproducibility and never affects replication at all"}, {"letter": "B", "text": "Others cannot follow the same procedure if key methodological details are missing"}, {"letter": "C", "text": "It causes the original data to be permanently deleted"}, {"letter": "D", "text": "It guarantees the original result was fabricated"}], "correct": "B", "explanation": "Replication requires re-running the same procedure on new data; if the procedure is under-reported, others cannot faithfully repeat it."}, {"type": "single", "stem": "The distinction between accuracy and precision/recall matters for reproducible reporting because:", "options": [{"letter": "A", "text": "Precision and recall can only ever be computed on the training data"}, {"letter": "B", "text": "Accuracy is always the most informative single metric"}, {"letter": "C", "text": "Recall is identical to accuracy under class imbalance"}, {"letter": "D", "text": "Different metrics can tell conflicting stories, so the choice of metric must be transparent"}], "correct": "D", "explanation": "Because metrics emphasise different errors, a paper reporting only a flattering metric can mislead; transparent, complete metric reporting supports reproducibility."}, {"type": "single", "stem": "Which reform most directly targets publication bias?", "options": [{"letter": "A", "text": "Mandating that every single experiment use one fixed random seed"}, {"letter": "B", "text": "Valuing and publishing well-conducted null results, not only positive findings"}, {"letter": "C", "text": "Banning the sharing of analysis code"}, {"letter": "D", "text": "Switching all journals to single-blind review"}], "correct": "B", "explanation": "Publication bias arises from preferring positive results; rewarding and publishing null findings (e.g. registered reports) counters the file-drawer effect."}, {"type": "single", "stem": "Miske et al. is referenced as a social-science example illustrating:", "options": [{"letter": "A", "text": "Practical reproducibility challenges within a field"}, {"letter": "B", "text": "A landmark double-blind review policy"}, {"letter": "C", "text": "The launch of a successful automated statistics-checking tool"}, {"letter": "D", "text": "The environmental cost of computation"}], "correct": "A", "explanation": "Like the Ioannidis genetics example, the social-science example is used to show that reproducing results is difficult in practice across disciplines."}, {"type": "single", "stem": "What is the relationship between open data and reproducibility, as the lecture frames it?", "options": [{"letter": "A", "text": "Open data and reproducibility are exactly the same thing"}, {"letter": "B", "text": "Reproducibility is only about sharing, never about re-running code"}, {"letter": "C", "text": "Open data is an enabler of reproducibility but not identical to it"}, {"letter": "D", "text": "Open data makes reproducibility impossible to assess"}], "correct": "C", "explanation": "Sharing data and code (open data) is a means that supports reproducibility (re-obtaining results), but reproducibility also depends on procedures, environment, and reporting."}, {"type": "single", "stem": "A reviewer recommends rejection in a tone that attacks the authors without specifics. Within the lecture's framing this exemplifies:", "options": [{"letter": "A", "text": "A routine computational reproducibility check of the analysis"}, {"letter": "B", "text": "A legitimate desk rejection by the editor"}, {"letter": "C", "text": "Constructive, actionable peer review"}, {"letter": "D", "text": "Destructive feedback (the 'Reviewer 2' stereotype)"}], "correct": "D", "explanation": "Harsh, non-specific, demoralising feedback typifies destructive reviewing (the 'Reviewer 2' trope), contrasted with constructive, improvement-oriented review."}, {"type": "single", "stem": "Which best summarises why the lecture treats data splitting carefully in CS/AI?", "options": [{"letter": "A", "text": "Splitting data is only ever needed for classical inferential statistics"}, {"letter": "B", "text": "Improper splits cause leakage and optimistic, non-reproducible performance estimates"}, {"letter": "C", "text": "Splitting replaces the need to report any metrics"}, {"letter": "D", "text": "Splitting guarantees a model will generalise perfectly"}], "correct": "B", "explanation": "Train/validation/test discipline prevents leakage and tuning-on-test, giving honest performance estimates; sloppy splitting inflates results and harms reproducibility."}, {"type": "single", "stem": "Which statement about confounds, underspecification, and leakage is correct?", "options": [{"letter": "A", "text": "They are simply three different names for exactly the same phenomenon"}, {"letter": "B", "text": "They are solved entirely by setting a random seed"}, {"letter": "C", "text": "All three can produce misleading model results, so the lecture pairs each with mitigations"}, {"letter": "D", "text": "They only arise in inferential statistics, not in AI"}], "correct": "C", "explanation": "Confounds (spurious associations), underspecification (non-unique solutions), and leakage (test info in training) are distinct issues, each discussed with its own solutions."}]}</script>
<script>
"use strict";
var QUIZ = JSON.parse(document.getElementById("quiz-data").textContent);
var submitted = false;
document.getElementById("title").textContent = QUIZ.title;
document.title = QUIZ.title;

function elem(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function radioOpt(name, value, labelText, bare) {
  var id = name + "_" + value;
  var input = elem("input", { type: "radio", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("span", bare ? {} : { class: "opt" }, [input, label]);
}
function checkOpt(name, value, labelText) {
  var id = name + "_" + value;
  var input = elem("input", { type: "checkbox", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("div", { class: "opt" }, [input, label]);
}

function buildQuestion(q, idx) {
  var card = elem("div", { class: "q", id: "q" + idx });
  var name = "q" + idx;
  if (q.type === "assertion_reason") {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + "." }));
    var a = elem("p", { class: "ar-line" });
    a.appendChild(elem("strong", { text: "Assertion: " }));
    a.appendChild(document.createTextNode(q.assertion));
    card.appendChild(a);
    var r = elem("p", { class: "ar-line" });
    r.appendChild(elem("strong", { text: "Reason: " }));
    r.appendChild(document.createTextNode(q.reason));
    card.appendChild(r);
  } else {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + ". " + (q.stem || "") }));
  }

  if (q.type === "single" || q.type === "assertion_reason") {
    var fs = elem("fieldset");
    fs.appendChild(elem("legend", { text: "Choose one answer" }));
    q.options.forEach(function (o) {
      fs.appendChild(radioOpt(name, o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fs);
  } else if (q.type === "true_false") {
    var fs2 = elem("fieldset");
    fs2.appendChild(elem("legend", { text: "True or False" }));
    fs2.appendChild(radioOpt(name, "true", "True"));
    fs2.appendChild(radioOpt(name, "false", "False"));
    card.appendChild(fs2);
  } else if (q.type === "multi") {
    card.appendChild(elem("p", { class: "right-col", text: "Select all that apply." }));
    q.options.forEach(function (o) {
      card.appendChild(checkOpt(name, o.letter, o.letter + ") " + o.text));
    });
  } else if (q.type === "mtf") {
    q.statements.forEach(function (s, j) {
      var sname = name + "_s" + j;
      var row = elem("div", { class: "stmt" });
      row.appendChild(elem("span", { class: "stmt-text", text: (j + 1) + ". " + s.text }));
      var tf = elem("span", { class: "stmt-tf" }, [
        radioOpt(sname, "true", "True", true),
        radioOpt(sname, "false", "False", true)
      ]);
      row.appendChild(tf);
      card.appendChild(row);
    });
  } else if (q.type === "two_tier") {
    var fsa = elem("fieldset");
    fsa.appendChild(elem("legend", { text: "Tier 1" }));
    q.tier1.options.forEach(function (o) {
      fsa.appendChild(radioOpt(name + "_t1", o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fsa);
    var tier = elem("div", { class: "tier" });
    tier.appendChild(elem("div", { class: "tier-q", text: q.tier2.stem }));
    var fsb = elem("fieldset");
    fsb.appendChild(elem("legend", { text: "Tier 2" }));
    q.tier2.options.forEach(function (o) {
      fsb.appendChild(radioOpt(name + "_t2", o.letter, o.letter + ") " + o.text));
    });
    tier.appendChild(fsb);
    card.appendChild(tier);
  } else if (q.type === "matching") {
    var tbl = elem("table", { class: "match" });
    q.lefts.forEach(function (l) {
      var sel = elem("select", { id: name + "_l" + l.num, "aria-label": "Match for " + l.text });
      sel.appendChild(elem("option", { value: "", text: "—" }));
      q.rights.forEach(function (rr) {
        sel.appendChild(elem("option", { value: rr.letter, text: rr.letter }));
      });
      var td1 = elem("td", { text: l.num + ". " + l.text });
      var td2 = elem("td", null, [sel]);
      tbl.appendChild(elem("tr", null, [td1, td2]));
    });
    card.appendChild(tbl);
    var rl = elem("div", { class: "right-col" }, [elem("p", { text: "Options:" })]);
    q.rights.forEach(function (rr) {
      rl.appendChild(elem("div", { text: rr.letter + ") " + rr.text }));
    });
    card.appendChild(rl);
  } else if (q.type === "ordering") {
    var n = q.items.length;
    card.appendChild(elem("p", { class: "right-col", text: "Assign each item a position (1 = first)." }));
    q.items.forEach(function (it) {
      var row = elem("div", { class: "li-pos" });
      var sel = elem("select", { id: name + "_pos" + it.id, "aria-label": "Position for " + it.text });
      sel.appendChild(elem("option", { value: "", text: "#" }));
      for (var p = 1; p <= n; p++) sel.appendChild(elem("option", { value: String(p), text: String(p) }));
      row.appendChild(sel);
      row.appendChild(elem("span", { class: "li-text", text: it.text }));
      card.appendChild(row);
    });
  }

  card.appendChild(elem("div", { class: "feedback", id: name + "_fb" }));
  return card;
}

function getRadio(name) {
  var r = document.querySelector('input[name="' + name + '"]:checked');
  return r ? r.value : null;
}

function gradeQuestion(q, idx) {
  var name = "q" + idx;
  var correct = false;
  var ansText = "";
  if (q.type === "single" || q.type === "assertion_reason") {
    correct = getRadio(name) === q.correct;
    ansText = "Correct answer: " + q.correct;
  } else if (q.type === "true_false") {
    correct = (getRadio(name) === "true") === q.correct;
    ansText = "Correct answer: " + (q.correct ? "True" : "False");
  } else if (q.type === "multi") {
    var chosen = Array.prototype.slice.call(
      document.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function (c) { return c.value; }).sort();
    var key = q.correct.slice().sort();
    correct = chosen.length === key.length && chosen.every(function (v, i) { return v === key[i]; });
    ansText = "Correct selection: " + key.join(", ");
  } else if (q.type === "mtf") {
    var all = true; var parts = [];
    q.statements.forEach(function (s, j) {
      var ok = (getRadio(name + "_s" + j) === "true") === s.answer;
      if (!ok) all = false;
      parts.push((j + 1) + ": " + (s.answer ? "True" : "False"));
      var row = document.querySelectorAll("#q" + idx + " .stmt")[j];
      if (row) row.appendChild(elem("span", { class: "mark " + (ok ? "ok" : "no"), text: ok ? "✓" : "✗" }));
    });
    correct = all;
    ansText = "Correct: " + parts.join(", ");
  } else if (q.type === "two_tier") {
    correct = getRadio(name + "_t1") === q.tier1.correct && getRadio(name + "_t2") === q.tier2.correct;
    ansText = "Correct: tier 1 = " + q.tier1.correct + ", tier 2 = " + q.tier2.correct;
  } else if (q.type === "matching") {
    var allm = true; var parts2 = [];
    q.lefts.forEach(function (l) {
      var sel = document.getElementById(name + "_l" + l.num);
      var want = q.answer[String(l.num)];
      if (!sel || sel.value !== want) allm = false;
      parts2.push(l.num + "→" + want);
    });
    correct = allm;
    ansText = "Correct matches: " + parts2.join(", ");
  } else if (q.type === "ordering") {
    var placed = [];
    q.items.forEach(function (it) {
      var sel = document.getElementById(name + "_pos" + it.id);
      placed.push({ id: it.id, pos: sel ? parseInt(sel.value, 10) : NaN });
    });
    placed.sort(function (a, b) { return a.pos - b.pos; });
    var seq = placed.map(function (p) { return p.id; });
    correct = seq.length === q.correct_order.length &&
              seq.every(function (v, i) { return v === q.correct_order[i]; });
    var byId = {}; q.items.forEach(function (it) { byId[it.id] = it.text; });
    ansText = "Correct order: " + q.correct_order.map(function (id, i) {
      return (i + 1) + ". " + byId[id]; }).join("  |  ");
  }

  var card = document.getElementById("q" + idx);
  card.classList.remove("correct", "incorrect");
  card.classList.add(correct ? "correct" : "incorrect");
  var fb = document.getElementById(name + "_fb");
  fb.innerHTML = "";
  fb.appendChild(elem("div", { class: "verdict " + (correct ? "ok" : "no"),
    text: correct ? "Correct" : "Incorrect" }));
  fb.appendChild(elem("div", { class: "ans", text: ansText }));
  if (q.explanation) fb.appendChild(elem("div", { class: "expl", text: q.explanation }));
  fb.classList.add("show");
  return correct;
}

function checkAll() {
  if (submitted) return;
  submitted = true;
  var score = 0;
  QUIZ.questions.forEach(function (q, i) { if (gradeQuestion(q, i)) score++; });
  document.getElementById("score").textContent = "Score: " + score + " / " + QUIZ.questions.length;
  document.getElementById("check").disabled = true;
}

function reset() {
  submitted = false;
  document.getElementById("check").disabled = false;
  document.getElementById("score").textContent = "";
  document.getElementById("quiz").innerHTML = "";
  buildAll();
}

function buildAll() {
  var container = document.getElementById("quiz");
  QUIZ.questions.forEach(function (q, i) { container.appendChild(buildQuestion(q, i)); });
}

document.getElementById("check").addEventListener("click", checkAll);
document.getElementById("reset").addEventListener("click", reset);
buildAll();
</script>
</body>
</html>
