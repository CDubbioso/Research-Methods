<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 6: Ethics in Research and AI</title>
<style>
  :root { --ok:#1a7f37; --okbg:#e8f5ec; --bad:#cf222e; --badbg:#fbe9ea;
          --line:#d0d7de; --muted:#57606a; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.5; color: #1f2328; margin: 0; padding: 1.5rem 1rem 5rem;
         background: #f6f8fa; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .q { background: #fff; border: 1px solid var(--line); border-radius: 10px;
       padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .q.correct { border-color: var(--ok); background: var(--okbg); }
  .q.incorrect { border-color: var(--bad); background: var(--badbg); }
  .stem { margin: 0 0 0.75rem; font-weight: 600; }
  .ar-line { margin: 0.15rem 0; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.3rem 0.4rem;
         border-radius: 6px; }
  .opt:hover { background: rgba(9,105,218,0.06); }
  .opt input { margin-top: 0.3rem; }
  .opt label { cursor: pointer; flex: 1; }
  .tier { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); }
  .tier-q { font-weight: 600; margin-bottom: 0.4rem; }
  .stmt { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.4rem 0;
          border-bottom: 1px solid #f0f0f0; }
  .stmt-text { flex: 1; }
  .stmt-tf label { margin-left: 0.6rem; }
  .mark { font-weight: 700; margin-left: 0.4rem; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--bad); }
  table.match { width: 100%; border-collapse: collapse; }
  table.match td { padding: 0.35rem 0.4rem; vertical-align: top; }
  .right-col { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
  select { padding: 0.25rem; border: 1px solid var(--line); border-radius: 6px;
           font-size: 0.95rem; background: #fff; }
  .feedback { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px;
              background: #fff; border: 1px solid var(--line); display: none; }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.ok { color: var(--ok); }
  .feedback .verdict.no { color: var(--bad); }
  .feedback .ans { margin-top: 0.3rem; }
  .feedback .expl { margin-top: 0.3rem; color: var(--muted); }
  .bar { position: sticky; bottom: 0; background: #f6f8fa; padding: 0.75rem 0;
         display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #score { font-weight: 700; font-size: 1.1rem; }
  .li-pos { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
  .li-pos .li-text { flex: 1; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Answer the questions, then press <strong>Check answers</strong>. Your selections stay private until you submit.</p>
  <div id="quiz"></div>
  <div class="bar">
    <button id="check">Check answers</button>
    <button id="reset" class="secondary">Reset</button>
    <span id="score" role="status" aria-live="polite"></span>
  </div>
</main>
<script id="quiz-data" type="application/json">{"title": "WG106 — Week 6: Ethics in Research and AI", "questions": [{"type": "single", "stem": "The Tuskegee Syphilis Study is presented as the historical case that motivated:", "options": [{"letter": "A", "text": "The EU AI Act's tiered risk classification of systems"}, {"letter": "B", "text": "The General Data Protection Regulation enacted across the European Union"}, {"letter": "C", "text": "The NeurIPS and AAAI reproducibility checklists"}, {"letter": "D", "text": "The Belmont Report and the establishment of institutional review boards (IRBs)"}], "correct": "D", "explanation": "Tuskegee's abuses prompted the Belmont Report's principles and the IRB system for prospective ethical review of research with human subjects."}, {"type": "matching", "stem": "Match each Belmont principle to the practice it primarily gives rise to:", "lefts": [{"num": 1, "text": "Justice"}, {"num": 2, "text": "Respect for Persons"}, {"num": 3, "text": "Beneficence"}], "rights": [{"letter": "A", "text": "Informed consent"}, {"letter": "B", "text": "Risk-benefit assessment"}, {"letter": "C", "text": "Fair subject selection"}], "answer": {"1": "C", "2": "A", "3": "B"}, "explanation": "The three Belmont principles map to consent (respect for persons/autonomy), weighing harms against benefits (beneficence), and fair distribution of burdens and benefits (justice)."}, {"type": "single", "stem": "Which of the following is NOT one of the three conditions of valid informed consent?", "options": [{"letter": "A", "text": "Information — participants are told what the study involves"}, {"letter": "B", "text": "Comprehension — participants understand that information"}, {"letter": "C", "text": "Compensation — participants must be paid for their time"}, {"letter": "D", "text": "Voluntariness — participation is free from coercion"}], "correct": "C", "explanation": "Valid consent requires information, comprehension, and voluntariness. Payment may occur but is not one of the three defining conditions (and excessive payment can even undermine voluntariness)."}, {"type": "single", "stem": "Beneficence in the Belmont framework is operationalised mainly through:", "options": [{"letter": "A", "text": "Assessing the kinds, severity, and likelihood of risks against the benefits"}, {"letter": "B", "text": "Obtaining a signed informed-consent form from every single participant"}, {"letter": "C", "text": "Pseudonymising the dataset before it is analysed"}, {"letter": "D", "text": "Selecting participants fairly across social groups"}], "correct": "A", "explanation": "Beneficence requires a risk-benefit assessment — weighing the type, severity, and probability of harm against expected benefits. Consent and fair selection serve other principles."}, {"type": "single", "stem": "The principle of Justice in research ethics is concerned with:", "options": [{"letter": "A", "text": "Ensuring that participants fully understand every one of the study procedures"}, {"letter": "B", "text": "Fairly distributing the burdens and benefits of research across groups"}, {"letter": "C", "text": "Guaranteeing that the results will be published openly"}, {"letter": "D", "text": "Minimising the total physical risk to each participant"}], "correct": "B", "explanation": "Justice addresses fair subject selection so that no group unfairly bears the risks or is unfairly denied the benefits of research."}, {"type": "single", "stem": "An IRB (or, at Leiden, the relevant ethics committee) functions to:", "options": [{"letter": "A", "text": "Review and approve research with human participants before it begins"}, {"letter": "B", "text": "Reproduce the statistical analyses after publication"}, {"letter": "C", "text": "Recruit suitable reviewers for the journal's confidential peer-review process"}, {"letter": "D", "text": "Anonymise datasets once the study has concluded"}], "correct": "A", "explanation": "Institutional review provides prospective ethical oversight: assessing consent, risk-benefit, and subject selection before data collection starts."}, {"type": "single", "stem": "In the Facebook/Meta (2014) emotional-contagion study, the consent defence rested on:", "options": [{"letter": "A", "text": "Users explicitly opting in to the experiment"}, {"letter": "B", "text": "An IRB granting a full waiver of consent"}, {"letter": "C", "text": "Each participant signing a detailed study-specific informed-consent form"}, {"letter": "D", "text": "Users having agreed to the platform's terms of service"}], "correct": "D", "explanation": "The study argued that broad terms-of-service agreement covered the manipulation — a defence widely judged inadequate for genuine informed consent."}, {"type": "single", "stem": "A striking feature of the Facebook (2014) study's risk-benefit picture was that:", "options": [{"letter": "A", "text": "There was simply no measurable effect on the users' emotional state whatsoever"}, {"letter": "B", "text": "The effect was very large but limited to a small pilot sample"}, {"letter": "C", "text": "The effect was tiny (about d = 0.001) yet applied at enormous scale, potentially affecting vulnerable users"}, {"letter": "D", "text": "Only users who had explicitly opted in were ever exposed"}], "correct": "C", "explanation": "The manipulation produced a minuscule effect (d≈0.001) but was deployed to hundreds of thousands, including potentially depressed users — a poor risk-benefit profile."}, {"type": "single", "stem": "Which of the following was NOT an ethical problem with the Facebook (2014) study?", "options": [{"letter": "A", "text": "There was no genuine opt-out from the manipulation"}, {"letter": "B", "text": "The study failed because it produced no detectable effect whatsoever"}, {"letter": "C", "text": "Consent rested only on broad terms-of-service agreement"}, {"letter": "D", "text": "Vulnerable users, quite possibly including some minors, could be adversely affected"}], "correct": "B", "explanation": "The problems were inadequate consent, exposure of vulnerable users (including minors), and no opt-out. The study did detect a (tiny) effect, so 'no effect' was not the issue."}, {"type": "matching", "stem": "Match each research stage to the ethics issue the lecture pairs with it:", "lefts": [{"num": 1, "text": "Data collection"}, {"num": 2, "text": "Data analysis"}, {"num": 3, "text": "Data storage"}], "rights": [{"letter": "A", "text": "GDPR compliance and data minimization"}, {"letter": "B", "text": "Consent and web-scraping rules (robots.txt, ToS)"}, {"letter": "C", "text": "Questionable research practices (QRPs)"}], "answer": {"1": "B", "2": "C", "3": "A"}, "explanation": "Ethics arises at every stage: consent/scraping at collection, GDPR/storage safeguards at storage, and analysis-stage QRPs like p-hacking and HARKing."}, {"type": "single", "stem": "Under GDPR, the principle of 'data minimization' requires that:", "options": [{"letter": "A", "text": "Only the personal data necessary for the stated purpose are collected"}, {"letter": "B", "text": "Participants must be financially compensated for any personal data collected"}, {"letter": "C", "text": "Data are encrypted using a specific government standard"}, {"letter": "D", "text": "All collected data are deleted within thirty days"}], "correct": "A", "explanation": "Data minimization means collecting no more personal data than necessary for the specified, legitimate purpose; retention limits and lawful basis are separate GDPR requirements."}, {"type": "single", "stem": "What distinguishes pseudonymization from anonymization under GDPR?", "options": [{"letter": "A", "text": "Pseudonymized data are public; anonymized data are kept strictly private"}, {"letter": "B", "text": "Pseudonymized data are numeric; anonymized data are categorical"}, {"letter": "C", "text": "Pseudonymized data are always fully encrypted, while anonymized data are stored in plain text"}, {"letter": "D", "text": "Pseudonymized data can be re-identified with a key; anonymized data cannot be re-identified"}], "correct": "D", "explanation": "Pseudonymization replaces identifiers but retains a re-identification key (still personal data); true anonymization removes the ability to re-identify, taking data outside GDPR's scope."}, {"type": "matching", "stem": "Match each questionable research practice (QRP) to its description:", "lefts": [{"num": 1, "text": "p-hacking"}, {"num": 2, "text": "Selective reporting"}, {"num": 3, "text": "HARKing"}], "rights": [{"letter": "A", "text": "Reporting only the outcomes that 'worked'"}, {"letter": "B", "text": "Presenting a post-hoc hypothesis as if predicted"}, {"letter": "C", "text": "Trying analyses until one crosses significance"}], "answer": {"1": "C", "2": "A", "3": "B"}, "explanation": "p-hacking exploits analytic flexibility for significance; HARKing (Hypothesising After Results are Known) dresses up post-hoc as a priori; selective reporting omits inconvenient results."}, {"type": "single", "stem": "Multiverse analysis (Steegen et al., 2016) is proposed as a response to:", "options": [{"letter": "A", "text": "The high carbon footprint of training very large models"}, {"letter": "B", "text": "The many defensible analytic choices that enable p-hacking"}, {"letter": "C", "text": "Non-compliance with data-sharing requests"}, {"letter": "D", "text": "The difficulty of recruiting peer reviewers"}], "correct": "B", "explanation": "Multiverse analysis reports results across the full set of reasonable analytic choices, exposing how robust (or fragile) a finding is to those choices rather than cherry-picking one path."}, {"type": "single", "stem": "Getty Images v. Stability AI is used in the lecture to illustrate ethical and legal issues around:", "options": [{"letter": "A", "text": "Informed consent within large social-media experiments"}, {"letter": "B", "text": "GDPR retention limits on stored data"}, {"letter": "C", "text": "Copyright in the data used to train AI models"}, {"letter": "D", "text": "Reproducibility of reported statistics"}], "correct": "C", "explanation": "The case concerns whether using copyrighted images to train a generative model infringes rights — a training-data copyright question."}, {"type": "single", "stem": "The Koko case is presented as an example of:", "options": [{"letter": "A", "text": "Deploying AI in a support service without disclosing it to users"}, {"letter": "B", "text": "Manipulating users' news feeds to alter their mood"}, {"letter": "C", "text": "Scraping a public forum and releasing the raw data"}, {"letter": "D", "text": "Reusing a colleague's identifiable participant dataset without any permission"}], "correct": "A", "explanation": "Koko involved using AI to help craft mental-health support messages without clearly disclosing the AI's involvement to the people receiving them — an undisclosed-AI/consent problem."}, {"type": "single", "stem": "When scraping a website for research data, which signals are most relevant to acting ethically?", "options": [{"letter": "A", "text": "The journal's preferred citation and referencing style"}, {"letter": "B", "text": "The site's robots.txt, its rate limits, and its terms of service"}, {"letter": "C", "text": "The website's colour scheme and overall visual accessibility design"}, {"letter": "D", "text": "The random seed used in the downstream analysis"}], "correct": "B", "explanation": "Ethical scraping respects robots.txt directives, server rate limits, and the site's terms of service, alongside consent and privacy considerations."}, {"type": "matching", "stem": "Match each EU AI Act (2024) risk tier to an example system:", "lefts": [{"num": 1, "text": "High risk"}, {"num": 2, "text": "Unacceptable risk"}, {"num": 3, "text": "Unacceptable risk"}, {"num": 4, "text": "High risk"}], "rights": [{"letter": "A", "text": "Government social scoring of citizens"}, {"letter": "B", "text": "Manipulative or emotion-inferring AI in sensitive contexts"}, {"letter": "C", "text": "AI used in hiring decisions"}, {"letter": "D", "text": "AI used in education admissions"}], "answer": {"1": "D", "2": "A", "3": "B", "4": "C"}, "explanation": "The Act bans 'unacceptable' uses (social scoring, certain manipulative/emotion-inference systems) and tightly regulates 'high-risk' uses such as hiring, credit scoring, and education admissions."}, {"type": "single", "stem": "Which of the following is classified as 'unacceptable risk' (banned) rather than merely 'high risk' under the EU AI Act?", "options": [{"letter": "A", "text": "AI used in education admissions"}, {"letter": "B", "text": "AI systems used to make credit-scoring decisions"}, {"letter": "C", "text": "AI used to screen job applicants"}, {"letter": "D", "text": "Government social scoring of citizens"}], "correct": "D", "explanation": "Social scoring (and certain manipulative/emotion-inference systems) is prohibited outright; hiring, credit scoring, and education admissions are regulated as high-risk, not banned."}, {"type": "single", "stem": "Which of the following is NOT one of the AI-specific ethical concerns the lecture raises?", "options": [{"letter": "A", "text": "Poor working conditions for data labellers"}, {"letter": "B", "text": "The substantial environmental cost of training very large models"}, {"letter": "C", "text": "The impossibility of writing any documentation for AI systems"}, {"letter": "D", "text": "Biased training data producing unfair outputs"}], "correct": "C", "explanation": "Concerns include labeller conditions, biased data, unauditable models, and environmental cost. 'Documentation being impossible' is not among them; documentation is in fact encouraged."}, {"type": "single", "stem": "Applying the Belmont principle of Respect for Persons to AI systems most directly supports:", "options": [{"letter": "A", "text": "Improving the pay and conditions of crowdsourced data labellers"}, {"letter": "B", "text": "Reducing the energy used to train the model"}, {"letter": "C", "text": "Auditing the training data for demographic bias"}, {"letter": "D", "text": "Transparency, explainability, and a right to contest decisions"}], "correct": "D", "explanation": "Respect for persons/autonomy translates, in AI, into people understanding and being able to challenge decisions about them (transparency, explainability, contestability)."}, {"type": "single", "stem": "Applying Justice to AI, the lecture emphasises:", "options": [{"letter": "A", "text": "Minimising the latency of each model response"}, {"letter": "B", "text": "Bias audits and equitable access to the technology"}, {"letter": "C", "text": "Keeping the training procedure secret from competitors"}, {"letter": "D", "text": "Maximising the model's overall predictive accuracy"}], "correct": "B", "explanation": "Justice in AI focuses on fairness across groups — auditing for bias and ensuring equitable access — so benefits and harms are distributed fairly."}, {"type": "single", "stem": "A truncated y-axis on a bar chart is criticised in the lecture because it:", "options": [{"letter": "A", "text": "Visually exaggerates differences, making a misleading claim"}, {"letter": "B", "text": "Makes the entire chart impossible to colour in an appropriate way"}, {"letter": "C", "text": "Always violates GDPR data-storage requirements"}, {"letter": "D", "text": "Prevents the figure from being reproduced in code"}], "correct": "A", "explanation": "Cutting the axis so it does not start at zero inflates apparent differences; the lecture's theme is that a misleading figure is a misleading claim."}, {"type": "matching", "stem": "Match each plotting pitfall to why it misleads:", "lefts": [{"num": 1, "text": "Distorting 3D effects"}, {"num": 2, "text": "No uncertainty shown"}, {"num": 3, "text": "Truncated axis"}, {"num": 4, "text": "Combined/overloaded plot"}], "rights": [{"letter": "A", "text": "Hides how noisy the estimate is"}, {"letter": "B", "text": "Exaggerates small differences"}, {"letter": "C", "text": "Obscures the comparison being made"}, {"letter": "D", "text": "Skews perceived proportions"}], "answer": {"1": "D", "2": "A", "3": "B", "4": "C"}, "explanation": "Each bad-plot failure distorts interpretation: axis truncation, gratuitous 3D, omitted error bars, and overloaded composite plots all mislead the reader."}, {"type": "single", "stem": "Why does the lecture recommend palettes like viridis or Okabe-Ito?", "options": [{"letter": "A", "text": "They use the fewest possible colours to save ink"}, {"letter": "B", "text": "They automatically strip any outliers out of the plotted data"}, {"letter": "C", "text": "They remain distinguishable for colourblind viewers"}, {"letter": "D", "text": "They are required by GDPR for any data figure"}], "correct": "C", "explanation": "Colourblind-safe palettes (viridis, Okabe-Ito, ColorBrewer) keep categories distinguishable for people with colour-vision deficiencies; tools like colorblindcheck verify this."}, {"type": "true_false", "stem": "Anonymized data (with no possibility of re-identification) generally fall outside GDPR's scope as personal data.", "correct": true, "explanation": "True. If data are truly anonymized so individuals cannot be re-identified, they are no longer personal data and GDPR's requirements no longer apply; pseudonymized data remain in scope."}, {"type": "true_false", "stem": "Agreeing to a platform's terms of service constitutes valid informed consent for any research experiment the platform runs.", "correct": false, "explanation": "False. The Facebook case showed that broad ToS agreement does not meet the information, comprehension, and voluntariness conditions of informed consent for a specific experiment."}, {"type": "single", "stem": "A researcher runs twenty subgroup analyses and reports only the two that reached p \u003c .05. This is best described as:", "options": [{"letter": "A", "text": "A legitimate confirmatory test of a single hypothesis"}, {"letter": "B", "text": "Pseudonymization of the dataset before analysis"}, {"letter": "C", "text": "p-hacking combined with selective reporting"}, {"letter": "D", "text": "Multiverse analysis of the analytic choices"}], "correct": "C", "explanation": "Searching many analyses and reporting only the significant ones inflates false positives (p-hacking) and hides the rest (selective reporting)."}, {"type": "single", "stem": "A researcher observes an unexpected correlation, then writes the introduction as though they had predicted it. This is:", "options": [{"letter": "A", "text": "Transparent pre-registration of the study's original hypothesis"}, {"letter": "B", "text": "HARKing — hypothesising after the results are known"}, {"letter": "C", "text": "Data minimization under GDPR"}, {"letter": "D", "text": "A risk-benefit assessment for the study"}], "correct": "B", "explanation": "Presenting a post-hoc hypothesis as a priori is HARKing, which misrepresents exploratory findings as confirmatory and distorts the evidentiary record."}, {"type": "single", "stem": "Scraping a public Reddit forum and releasing the raw posts as a dataset raises which primary concern?", "options": [{"letter": "A", "text": "The scraped data cannot be loaded into R without several extra packages"}, {"letter": "B", "text": "The figures will use a colourblind-unsafe palette"}, {"letter": "C", "text": "The analysis will necessarily overfit the training data"}, {"letter": "D", "text": "Users did not consent to research reuse, and posts may be identifiable"}], "correct": "D", "explanation": "Public availability does not equal consent; releasing identifiable posts implicates consent and privacy (and potentially GDPR), the core ethical issue in this scenario."}, {"type": "single", "stem": "Reusing a colleague's identifiable dataset for a new, unrelated purpose without permission most directly conflicts with:", "options": [{"letter": "A", "text": "Consent and purpose-limitation expectations for the data"}, {"letter": "B", "text": "The 1.5×IQR rule for flagging outliers"}, {"letter": "C", "text": "The methodological requirement to average results across several random seeds"}, {"letter": "D", "text": "The single-blind peer-review convention"}], "correct": "A", "explanation": "Participants consented for a specific purpose; repurposing identifiable data without authorisation breaches consent and purpose limitation (a GDPR principle)."}, {"type": "single", "stem": "Why does the lecture say 'a misleading figure is a misleading claim'?", "options": [{"letter": "A", "text": "A figure can never convey uncertainty accurately"}, {"letter": "B", "text": "Figures are, in law, treated as formal scientific claims in themselves"}, {"letter": "C", "text": "All figures must be accompanied by a statistical test"}, {"letter": "D", "text": "Visual distortions can make readers draw false conclusions just as text can"}], "correct": "D", "explanation": "A chart communicates an assertion; if its design distorts the data (truncated axes, missing uncertainty), it misleads the reader exactly as a false statement would."}, {"type": "single", "stem": "Which is the strongest reason the absence of error bars (uncertainty) is a visualisation problem?", "options": [{"letter": "A", "text": "The plot will not render in colourblind-safe palettes"}, {"letter": "B", "text": "It prevents the published figure from being reproduced directly from code"}, {"letter": "C", "text": "Readers cannot judge whether an apparent difference is meaningful or just noise"}, {"letter": "D", "text": "It violates the GDPR principle of data minimization"}], "correct": "C", "explanation": "Without shown uncertainty, a difference may be within noise; omitting it can make a non-result look like a real effect."}, {"type": "true_false", "stem": "Under the EU AI Act, AI used for hiring decisions is banned outright as an unacceptable-risk system.", "correct": false, "explanation": "False. Hiring AI is classified as high-risk (heavily regulated), not unacceptable-risk (banned). Banned uses include social scoring and certain manipulative/emotion-inference systems."}, {"type": "single", "stem": "What does it mean that some AI models are 'unauditable', as a Belmont-applied concern?", "options": [{"letter": "A", "text": "Their underlying training data are simply far too small to be useful"}, {"letter": "B", "text": "Their decision process is opaque, undermining transparency and the right to contest"}, {"letter": "C", "text": "They always violate data-minimization rules"}, {"letter": "D", "text": "They cannot be deployed on consumer hardware"}], "correct": "B", "explanation": "If a model's reasoning cannot be inspected, affected people cannot understand or challenge decisions — clashing with respect-for-persons values of transparency and contestability."}, {"type": "single", "stem": "Which scenario best illustrates a Justice (rather than consent) failure in AI?", "options": [{"letter": "A", "text": "A hiring model performs far worse for one demographic group than another"}, {"letter": "B", "text": "A personal dataset was kept long after its lawful retention period had expired"}, {"letter": "C", "text": "Users were never told an AI was involved in the service"}, {"letter": "D", "text": "A figure used a truncated axis to exaggerate an effect"}], "correct": "A", "explanation": "Unequal performance across groups is a fairness/justice problem (addressed by bias audits and equitable access). Undisclosed AI is a consent issue; retention is a GDPR issue."}, {"type": "assertion_reason", "assertion": "The Facebook (2014) study had an acceptable risk-benefit profile.", "reason": "The measured effect of the manipulation was extremely small (about d = 0.001).", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "D", "explanation": "The reason is true (the effect was tiny), but it actually undercuts the assertion: a negligible benefit deployed at massive scale to potentially vulnerable users is a poor, not acceptable, risk-benefit trade-off."}, {"type": "assertion_reason", "assertion": "Using a colourblind-safe palette such as Okabe-Ito improves a figure's accessibility.", "reason": "Such palettes keep categories distinguishable for viewers with colour-vision deficiencies.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "A", "explanation": "Both true and the reason explains the assertion: the palettes are designed so colourblind viewers can still tell categories apart, which is what makes the figure more accessible."}, {"type": "single", "stem": "How does the lecture relate the Belmont framework to GDPR when placed side by side?", "options": [{"letter": "A", "text": "They are identical frameworks with different names"}, {"letter": "B", "text": "GDPR replaces Belmont entirely for all modern research"}, {"letter": "C", "text": "Both protect participants, but Belmont is ethical principles while GDPR is legal data rules"}, {"letter": "D", "text": "The Belmont Report applies only to AI, whereas GDPR applies only to surveys"}], "correct": "C", "explanation": "Belmont gives ethical principles (consent, beneficence, justice); GDPR gives legal data-protection obligations (lawful basis, minimization, retention, access). They overlap but are not the same."}, {"type": "single", "stem": "Which of the following is NOT a GDPR concept discussed under data storage?", "options": [{"letter": "A", "text": "Lawful basis for processing"}, {"letter": "B", "text": "1.5×IQR outlier rule"}, {"letter": "C", "text": "Data minimization"}, {"letter": "D", "text": "Retention limits and access rights"}], "correct": "B", "explanation": "GDPR storage concerns include lawful basis, minimization, retention, and access. The 1.5×IQR rule is a statistics/exploratory-analysis concept, not a GDPR concept."}, {"type": "single", "stem": "Why are poor data-labeller working conditions raised as an AI ethics issue specifically?", "options": [{"letter": "A", "text": "Labelling automatically violates GDPR retention limits"}, {"letter": "B", "text": "Labellers determine the model's random seed selection"}, {"letter": "C", "text": "Data labelling is the only research step that ever requires informed consent"}, {"letter": "D", "text": "Human labour underlies AI datasets, so labellers' welfare is an ethical responsibility"}], "correct": "D", "explanation": "Much AI data is annotated by low-paid crowdworkers; the lecture flags their conditions as an ethical concern about how datasets are produced."}, {"type": "single", "stem": "A study deploys an undisclosed AI chatbot to give participants advice. The clearest ethical breach is:", "options": [{"letter": "A", "text": "Lack of disclosure undermines informed consent about what participants are interacting with"}, {"letter": "B", "text": "The advice cannot be reproduced from shared code"}, {"letter": "C", "text": "The advice chatbot noticeably increases the study's overall computational cost"}, {"letter": "D", "text": "The figures will need a colourblind-safe palette"}], "correct": "A", "explanation": "As in the Koko case, failing to disclose AI involvement means participants cannot give informed consent to that interaction — a respect-for-persons violation."}, {"type": "single", "stem": "Which best captures why the lecture says ethics 'enters at every stage' of research?", "options": [{"letter": "A", "text": "Each stage — collection, storage, analysis, presentation — has its own ethical risks"}, {"letter": "B", "text": "Research ethics is solely a matter for the final publication step alone"}, {"letter": "C", "text": "Ethical review is needed only when minors are involved"}, {"letter": "D", "text": "Only data collection raises any ethical concerns"}], "correct": "A", "explanation": "Consent/scraping at collection, GDPR at storage, QRPs at analysis, and misleading figures at presentation show that ethical issues recur throughout the pipeline."}, {"type": "single", "stem": "What is the main ethical problem with emotion-inference AI being placed in the EU AI Act's most restricted tier (in sensitive contexts)?", "options": [{"letter": "A", "text": "Emotion data are exempt from all privacy regulation"}, {"letter": "B", "text": "Inferring human emotions is essentially computationally impossible to perform"}, {"letter": "C", "text": "Such systems always have perfect predictive accuracy"}, {"letter": "D", "text": "Inferring emotions can be manipulative and intrusive, harming autonomy"}], "correct": "D", "explanation": "Certain emotion-inference and manipulative uses are treated as unacceptable because they threaten autonomy and can be coercive or intrusive in sensitive settings."}, {"type": "single", "stem": "A figure uses a rainbow colour scheme that two reviewers (who are colourblind) cannot interpret. The best fix consistent with the lecture is to:", "options": [{"letter": "A", "text": "Add a truncated axis to emphasise the key bars"}, {"letter": "B", "text": "Convert the figure into a distorting 3D chart"}, {"letter": "C", "text": "Switch to a colourblind-safe palette and verify it with a checking tool"}, {"letter": "D", "text": "Remove all of the uncertainty bars in order to simplify the plot"}], "correct": "C", "explanation": "Use viridis/Okabe-Ito/ColorBrewer and verify with colorblindcheck. The distractors are themselves named bad-plot practices."}, {"type": "single", "stem": "Which combination correctly pairs a Belmont principle with its AI-applied safeguard?", "options": [{"letter": "A", "text": "Beneficence → ensuring equitable access to the system"}, {"letter": "B", "text": "Beneficence → harm testing before deployment"}, {"letter": "C", "text": "Justice → informed consent forms for each user"}, {"letter": "D", "text": "Respect for Persons → minimising the model's energy use"}], "correct": "B", "explanation": "Beneficence (do no harm / weigh harms) maps to harm testing. Justice maps to bias audits/equitable access; respect for persons maps to transparency/contestability."}, {"type": "single", "stem": "Why is 'fair subject selection' (Justice) relevant even when consent and risk-benefit are handled well?", "options": [{"letter": "A", "text": "Otherwise the burdens or benefits of research can fall unfairly on particular groups"}, {"letter": "B", "text": "It ensures the analysis avoids all questionable practices"}, {"letter": "C", "text": "It removes the need for any institutional review"}, {"letter": "D", "text": "It is the single only way to guarantee that informed consent remains valid"}], "correct": "A", "explanation": "Justice addresses who bears risks and who gains benefits; even with valid consent and a good risk-benefit ratio, selecting subjects unfairly is its own ethical failure."}, {"type": "single", "stem": "A team retains identifiable participant data indefinitely 'just in case'. Under GDPR this most directly conflicts with:", "options": [{"letter": "A", "text": "The right to contest an automated decision"}, {"letter": "B", "text": "Retention limits and the data-minimization principle"}, {"letter": "C", "text": "The 1.5×IQR rule for outlier detection"}, {"letter": "D", "text": "The Belmont ethical principle of fair subject selection"}], "correct": "B", "explanation": "Keeping personal data longer than necessary breaches GDPR retention/minimization requirements; the other options concern different frameworks or are unrelated."}, {"type": "single", "stem": "Which statement best distinguishes the EU AI Act's 'high-risk' from 'unacceptable-risk' categories?", "options": [{"letter": "A", "text": "High-risk applies to research only; unacceptable-risk to commerce only"}, {"letter": "B", "text": "High-risk systems are banned outright, while unacceptable-risk systems are merely monitored"}, {"letter": "C", "text": "High-risk systems are permitted under strict requirements; unacceptable-risk systems are banned"}, {"letter": "D", "text": "Both categories are banned, differing only in penalty size"}], "correct": "C", "explanation": "High-risk uses (hiring, credit scoring, education admissions) are allowed subject to obligations; unacceptable-risk uses (social scoring, certain manipulative/emotion systems) are prohibited."}]}</script>
<script>
"use strict";
var QUIZ = JSON.parse(document.getElementById("quiz-data").textContent);
var submitted = false;
document.getElementById("title").textContent = QUIZ.title;
document.title = QUIZ.title;

function elem(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function radioOpt(name, value, labelText, bare) {
  var id = name + "_" + value;
  var input = elem("input", { type: "radio", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("span", bare ? {} : { class: "opt" }, [input, label]);
}
function checkOpt(name, value, labelText) {
  var id = name + "_" + value;
  var input = elem("input", { type: "checkbox", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("div", { class: "opt" }, [input, label]);
}

function buildQuestion(q, idx) {
  var card = elem("div", { class: "q", id: "q" + idx });
  var name = "q" + idx;
  if (q.type === "assertion_reason") {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + "." }));
    var a = elem("p", { class: "ar-line" });
    a.appendChild(elem("strong", { text: "Assertion: " }));
    a.appendChild(document.createTextNode(q.assertion));
    card.appendChild(a);
    var r = elem("p", { class: "ar-line" });
    r.appendChild(elem("strong", { text: "Reason: " }));
    r.appendChild(document.createTextNode(q.reason));
    card.appendChild(r);
  } else {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + ". " + (q.stem || "") }));
  }

  if (q.type === "single" || q.type === "assertion_reason") {
    var fs = elem("fieldset");
    fs.appendChild(elem("legend", { text: "Choose one answer" }));
    q.options.forEach(function (o) {
      fs.appendChild(radioOpt(name, o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fs);
  } else if (q.type === "true_false") {
    var fs2 = elem("fieldset");
    fs2.appendChild(elem("legend", { text: "True or False" }));
    fs2.appendChild(radioOpt(name, "true", "True"));
    fs2.appendChild(radioOpt(name, "false", "False"));
    card.appendChild(fs2);
  } else if (q.type === "multi") {
    card.appendChild(elem("p", { class: "right-col", text: "Select all that apply." }));
    q.options.forEach(function (o) {
      card.appendChild(checkOpt(name, o.letter, o.letter + ") " + o.text));
    });
  } else if (q.type === "mtf") {
    q.statements.forEach(function (s, j) {
      var sname = name + "_s" + j;
      var row = elem("div", { class: "stmt" });
      row.appendChild(elem("span", { class: "stmt-text", text: (j + 1) + ". " + s.text }));
      var tf = elem("span", { class: "stmt-tf" }, [
        radioOpt(sname, "true", "True", true),
        radioOpt(sname, "false", "False", true)
      ]);
      row.appendChild(tf);
      card.appendChild(row);
    });
  } else if (q.type === "two_tier") {
    var fsa = elem("fieldset");
    fsa.appendChild(elem("legend", { text: "Tier 1" }));
    q.tier1.options.forEach(function (o) {
      fsa.appendChild(radioOpt(name + "_t1", o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fsa);
    var tier = elem("div", { class: "tier" });
    tier.appendChild(elem("div", { class: "tier-q", text: q.tier2.stem }));
    var fsb = elem("fieldset");
    fsb.appendChild(elem("legend", { text: "Tier 2" }));
    q.tier2.options.forEach(function (o) {
      fsb.appendChild(radioOpt(name + "_t2", o.letter, o.letter + ") " + o.text));
    });
    tier.appendChild(fsb);
    card.appendChild(tier);
  } else if (q.type === "matching") {
    var tbl = elem("table", { class: "match" });
    q.lefts.forEach(function (l) {
      var sel = elem("select", { id: name + "_l" + l.num, "aria-label": "Match for " + l.text });
      sel.appendChild(elem("option", { value: "", text: "—" }));
      q.rights.forEach(function (rr) {
        sel.appendChild(elem("option", { value: rr.letter, text: rr.letter }));
      });
      var td1 = elem("td", { text: l.num + ". " + l.text });
      var td2 = elem("td", null, [sel]);
      tbl.appendChild(elem("tr", null, [td1, td2]));
    });
    card.appendChild(tbl);
    var rl = elem("div", { class: "right-col" }, [elem("p", { text: "Options:" })]);
    q.rights.forEach(function (rr) {
      rl.appendChild(elem("div", { text: rr.letter + ") " + rr.text }));
    });
    card.appendChild(rl);
  } else if (q.type === "ordering") {
    var n = q.items.length;
    card.appendChild(elem("p", { class: "right-col", text: "Assign each item a position (1 = first)." }));
    q.items.forEach(function (it) {
      var row = elem("div", { class: "li-pos" });
      var sel = elem("select", { id: name + "_pos" + it.id, "aria-label": "Position for " + it.text });
      sel.appendChild(elem("option", { value: "", text: "#" }));
      for (var p = 1; p <= n; p++) sel.appendChild(elem("option", { value: String(p), text: String(p) }));
      row.appendChild(sel);
      row.appendChild(elem("span", { class: "li-text", text: it.text }));
      card.appendChild(row);
    });
  }

  card.appendChild(elem("div", { class: "feedback", id: name + "_fb" }));
  return card;
}

function getRadio(name) {
  var r = document.querySelector('input[name="' + name + '"]:checked');
  return r ? r.value : null;
}

function gradeQuestion(q, idx) {
  var name = "q" + idx;
  var correct = false;
  var ansText = "";
  if (q.type === "single" || q.type === "assertion_reason") {
    correct = getRadio(name) === q.correct;
    ansText = "Correct answer: " + q.correct;
  } else if (q.type === "true_false") {
    correct = (getRadio(name) === "true") === q.correct;
    ansText = "Correct answer: " + (q.correct ? "True" : "False");
  } else if (q.type === "multi") {
    var chosen = Array.prototype.slice.call(
      document.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function (c) { return c.value; }).sort();
    var key = q.correct.slice().sort();
    correct = chosen.length === key.length && chosen.every(function (v, i) { return v === key[i]; });
    ansText = "Correct selection: " + key.join(", ");
  } else if (q.type === "mtf") {
    var all = true; var parts = [];
    q.statements.forEach(function (s, j) {
      var ok = (getRadio(name + "_s" + j) === "true") === s.answer;
      if (!ok) all = false;
      parts.push((j + 1) + ": " + (s.answer ? "True" : "False"));
      var row = document.querySelectorAll("#q" + idx + " .stmt")[j];
      if (row) row.appendChild(elem("span", { class: "mark " + (ok ? "ok" : "no"), text: ok ? "✓" : "✗" }));
    });
    correct = all;
    ansText = "Correct: " + parts.join(", ");
  } else if (q.type === "two_tier") {
    correct = getRadio(name + "_t1") === q.tier1.correct && getRadio(name + "_t2") === q.tier2.correct;
    ansText = "Correct: tier 1 = " + q.tier1.correct + ", tier 2 = " + q.tier2.correct;
  } else if (q.type === "matching") {
    var allm = true; var parts2 = [];
    q.lefts.forEach(function (l) {
      var sel = document.getElementById(name + "_l" + l.num);
      var want = q.answer[String(l.num)];
      if (!sel || sel.value !== want) allm = false;
      parts2.push(l.num + "→" + want);
    });
    correct = allm;
    ansText = "Correct matches: " + parts2.join(", ");
  } else if (q.type === "ordering") {
    var placed = [];
    q.items.forEach(function (it) {
      var sel = document.getElementById(name + "_pos" + it.id);
      placed.push({ id: it.id, pos: sel ? parseInt(sel.value, 10) : NaN });
    });
    placed.sort(function (a, b) { return a.pos - b.pos; });
    var seq = placed.map(function (p) { return p.id; });
    correct = seq.length === q.correct_order.length &&
              seq.every(function (v, i) { return v === q.correct_order[i]; });
    var byId = {}; q.items.forEach(function (it) { byId[it.id] = it.text; });
    ansText = "Correct order: " + q.correct_order.map(function (id, i) {
      return (i + 1) + ". " + byId[id]; }).join("  |  ");
  }

  var card = document.getElementById("q" + idx);
  card.classList.remove("correct", "incorrect");
  card.classList.add(correct ? "correct" : "incorrect");
  var fb = document.getElementById(name + "_fb");
  fb.innerHTML = "";
  fb.appendChild(elem("div", { class: "verdict " + (correct ? "ok" : "no"),
    text: correct ? "Correct" : "Incorrect" }));
  fb.appendChild(elem("div", { class: "ans", text: ansText }));
  if (q.explanation) fb.appendChild(elem("div", { class: "expl", text: q.explanation }));
  fb.classList.add("show");
  return correct;
}

function checkAll() {
  if (submitted) return;
  submitted = true;
  var score = 0;
  QUIZ.questions.forEach(function (q, i) { if (gradeQuestion(q, i)) score++; });
  document.getElementById("score").textContent = "Score: " + score + " / " + QUIZ.questions.length;
  document.getElementById("check").disabled = true;
}

function reset() {
  submitted = false;
  document.getElementById("check").disabled = false;
  document.getElementById("score").textContent = "";
  document.getElementById("quiz").innerHTML = "";
  buildAll();
}

function buildAll() {
  var container = document.getElementById("quiz");
  QUIZ.questions.forEach(function (q, i) { container.appendChild(buildQuestion(q, i)); });
}

document.getElementById("check").addEventListener("click", checkAll);
document.getElementById("reset").addEventListener("click", reset);
buildAll();
</script>
</body>
</html>
