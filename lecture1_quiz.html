<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WG106 — Week 1: Principles of Scientific Research</title>
<style>
  :root { --ok:#1a7f37; --okbg:#e8f5ec; --bad:#cf222e; --badbg:#fbe9ea;
          --line:#d0d7de; --muted:#57606a; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.5; color: #1f2328; margin: 0; padding: 1.5rem 1rem 5rem;
         background: #f6f8fa; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .q { background: #fff; border: 1px solid var(--line); border-radius: 10px;
       padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .q.correct { border-color: var(--ok); background: var(--okbg); }
  .q.incorrect { border-color: var(--bad); background: var(--badbg); }
  .stem { margin: 0 0 0.75rem; font-weight: 600; }
  .ar-line { margin: 0.15rem 0; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.3rem 0.4rem;
         border-radius: 6px; }
  .opt:hover { background: rgba(9,105,218,0.06); }
  .opt input { margin-top: 0.3rem; }
  .opt label { cursor: pointer; flex: 1; }
  .tier { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); }
  .tier-q { font-weight: 600; margin-bottom: 0.4rem; }
  .stmt { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.4rem 0;
          border-bottom: 1px solid #f0f0f0; }
  .stmt-text { flex: 1; }
  .stmt-tf label { margin-left: 0.6rem; }
  .mark { font-weight: 700; margin-left: 0.4rem; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--bad); }
  table.match { width: 100%; border-collapse: collapse; }
  table.match td { padding: 0.35rem 0.4rem; vertical-align: top; }
  .right-col { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
  select { padding: 0.25rem; border: 1px solid var(--line); border-radius: 6px;
           font-size: 0.95rem; background: #fff; }
  .feedback { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px;
              background: #fff; border: 1px solid var(--line); display: none; }
  .feedback.show { display: block; }
  .feedback .verdict { font-weight: 700; }
  .feedback .verdict.ok { color: var(--ok); }
  .feedback .verdict.no { color: var(--bad); }
  .feedback .ans { margin-top: 0.3rem; }
  .feedback .expl { margin-top: 0.3rem; color: var(--muted); }
  .bar { position: sticky; bottom: 0; background: #f6f8fa; padding: 0.75rem 0;
         display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #score { font-weight: 700; font-size: 1.1rem; }
  .li-pos { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
  .li-pos .li-text { flex: 1; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Answer the questions, then press <strong>Check answers</strong>. Your selections stay private until you submit.</p>
  <div id="quiz"></div>
  <div class="bar">
    <button id="check">Check answers</button>
    <button id="reset" class="secondary">Reset</button>
    <span id="score" role="status" aria-live="polite"></span>
  </div>
</main>
<script id="quiz-data" type="application/json">{"title": "WG106 — Week 1: Principles of Scientific Research", "questions": [{"type": "single", "stem": "In the Wason selection task (cards showing 'A', 'D', '4', '7' with the rule 'if a card has a vowel on one side, it has an even number on the other'), which cards must be turned over to properly test the rule?", "options": [{"letter": "A", "text": "'A' only"}, {"letter": "B", "text": "'4' and '7'"}, {"letter": "C", "text": "'A' and '7'"}, {"letter": "D", "text": "'A' and '4'"}], "correct": "C", "explanation": "Proper testing requires looking for a falsifying case. 'A' (vowel) must show an even number, and '7' (odd) must NOT show a vowel. Turning '4' only confirms; it cannot falsify. The pull toward 'A' and '4' is confirmation bias."}, {"type": "single", "stem": "The common error people make on the Wason selection task — preferring to turn the card that could confirm the rule rather than the card that could break it — is an illustration of which bias?", "options": [{"letter": "A", "text": "Representativeness heuristic"}, {"letter": "B", "text": "Confirmation bias"}, {"letter": "C", "text": "Availability heuristic"}, {"letter": "D", "text": "Hindsight bias"}], "correct": "B", "explanation": "Confirmation bias is the tendency to seek evidence that supports a hypothesis rather than evidence that could disprove it. The task is designed to expose exactly this tendency."}, {"type": "single", "stem": "Estimating that deaths from shark attacks are more common than deaths from falling airplane parts, because shark attacks are more vivid and frequently reported, is an example of which heuristic?", "options": [{"letter": "A", "text": "Availability heuristic"}, {"letter": "B", "text": "Representativeness heuristic"}, {"letter": "C", "text": "Hindsight bias"}, {"letter": "D", "text": "Confirmation bias"}], "correct": "A", "explanation": "The availability heuristic judges probability by how easily examples come to mind. Memorable, heavily reported events feel more frequent than they are."}, {"type": "true_false", "stem": "The 'Arthur the librarian' problem illustrates the representativeness heuristic: people judge Arthur likely to be a librarian because he matches a stereotype, ignoring base rates.", "correct": true, "explanation": "True. Judging category membership by similarity to a prototype while ignoring how common each category actually is (base rates) is the representativeness heuristic."}, {"type": "single", "stem": "After an election result is announced, many people feel they 'knew it all along.' This describes:", "options": [{"letter": "A", "text": "A common-response confound"}, {"letter": "B", "text": "The availability heuristic"}, {"letter": "C", "text": "Confirmation bias"}, {"letter": "D", "text": "Hindsight bias"}], "correct": "D", "explanation": "Hindsight bias is the tendency, once an outcome is known, to overestimate how predictable it was beforehand."}, {"type": "single", "stem": "Feynman's maxim 'the first principle is that you must not fool yourself — and you are the easiest person to fool' is invoked in the lecture mainly to motivate:", "options": [{"letter": "A", "text": "Building scientific methods that guard against our own cognitive biases"}, {"letter": "B", "text": "Trusting the trained intuition of experienced experts rather than relying on formal, systematic testing"}, {"letter": "C", "text": "Preregistering every hypothesis"}, {"letter": "D", "text": "Choosing larger sample sizes"}], "correct": "A", "explanation": "The biases section uses Feynman to frame why scientific method exists: our reasoning is systematically biased, so we need procedures that protect us from self-deception."}, {"type": "ordering", "stem": "Order the stages of the empirical cycle as presented:", "items": [{"id": 0, "text": "Induction"}, {"id": 1, "text": "Observation"}, {"id": 2, "text": "Evaluation"}, {"id": 3, "text": "Deduction"}, {"id": 4, "text": "Testing"}], "correct_order": [1, 0, 3, 4, 2], "explanation": "Observation of phenomena → Induction (generalising to a theory) → Deduction (deriving a falsifiable hypothesis) → Testing (collecting data) → Evaluation (interpreting results against the hypothesis)."}, {"type": "single", "stem": "In the empirical cycle, which step is described as involving a 'leap of faith'?", "options": [{"letter": "A", "text": "Testing — collecting and analysing data"}, {"letter": "B", "text": "Deduction — deriving a specific, testable hypothesis from an existing theory or model"}, {"letter": "C", "text": "Induction — generalising from specific observations to a broader theory"}, {"letter": "D", "text": "Evaluation — judging whether results support the hypothesis"}], "correct": "C", "explanation": "Induction generalises beyond the observed cases, so it can never be fully justified by the data alone — hence the 'leap of faith.' The serial-position example illustrates inducing a general pattern from limited observations."}, {"type": "single", "stem": "A hypothesis is scientifically useful, in the Popperian sense emphasised in the lecture, primarily when it is:", "options": [{"letter": "A", "text": "Intuitive — broadly consistent with common sense and prevailing expert opinion"}, {"letter": "B", "text": "Falsifiable — it makes a prediction that could in principle be shown false"}, {"letter": "C", "text": "Probable — likely to be true given prior beliefs"}, {"letter": "D", "text": "Confirmable — supported by at least one observation"}], "correct": "B", "explanation": "Deduction in the empirical cycle should yield a falsifiable hypothesis. A claim that no possible observation could contradict is not scientifically testable."}, {"type": "single", "stem": "The famous correlation between a country's chocolate consumption and its number of Nobel laureates is used in the lecture to illustrate that:", "options": [{"letter": "A", "text": "Convenience sampling is acceptable for pilot studies"}, {"letter": "B", "text": "Larger samples reduce bias"}, {"letter": "C", "text": "Within-subjects designs control for confounds"}, {"letter": "D", "text": "Correlation does not imply causation"}], "correct": "D", "explanation": "The chocolate–Nobel example is a classic spurious correlation: two variables move together without one causing the other, often due to a lurking common cause (e.g. national wealth)."}, {"type": "single", "stem": "The Gender Shades study (commercial face-classification systems performing far worse on darker-skinned women) is cited in the lecture as an example of a threat to which kind of validity?", "options": [{"letter": "A", "text": "Construct validity — the measure failing to capture the theoretical concept it is meant to represent"}, {"letter": "B", "text": "Internal validity — a confound producing the effect"}, {"letter": "C", "text": "Statistical conclusion validity — an underpowered test"}, {"letter": "D", "text": "External validity — results failing to generalise to a broader population"}], "correct": "D", "explanation": "Gender Shades shows that a system validated on one population may not generalise to others. Generalisation across populations and settings is external validity."}, {"type": "matching", "stem": "Match each sampling concept to its description:", "lefts": [{"num": 1, "text": "Convenience sampling"}, {"num": 2, "text": "Internal validity"}, {"num": 3, "text": "External validity"}, {"num": 4, "text": "Simple random sampling"}], "rights": [{"letter": "A", "text": "The degree to which an effect can be attributed to the manipulation, not confounds"}, {"letter": "B", "text": "Every member of the population has an equal chance of selection"}, {"letter": "C", "text": "Participants are chosen because they are easy to reach"}, {"letter": "D", "text": "The degree to which findings generalise beyond the sample"}], "answer": {"1": "C", "2": "A", "3": "D", "4": "B"}, "explanation": "Random sampling supports generalisation; convenience sampling threatens it. External validity is about generalisation; internal validity is about ruling out alternative causes within the study."}, {"type": "single", "stem": "Ice cream sales and shark attacks rise together each summer. Temperature drives both. In the language of the lecture, temperature is best described as a:", "options": [{"letter": "A", "text": "Common-response confound (a third variable causing both)"}, {"letter": "B", "text": "Mediator that transmits the effect of ice cream on shark attacks"}, {"letter": "C", "text": "Dependent variable"}, {"letter": "D", "text": "Moderator of the ice-cream–shark relationship"}], "correct": "A", "explanation": "Both observed variables respond to a common cause (temperature). This 'common-response' pattern produces a non-causal correlation between them and threatens internal validity if unaccounted for."}, {"type": "single", "stem": "Which of the following is the defining feature of an experimental (as opposed to correlational) study?", "options": [{"letter": "A", "text": "The study is conducted in a laboratory rather than the field"}, {"letter": "B", "text": "The researcher manipulates the independent variable"}, {"letter": "C", "text": "The sample is drawn randomly from the population"}, {"letter": "D", "text": "Two or more variables are measured and related"}], "correct": "B", "explanation": "Experiments are defined by manipulation of an IV (ideally with random assignment), which is what licenses causal inference. Correlational studies measure variables as they naturally occur."}, {"type": "single", "stem": "A researcher changes the font size of a reading passage and measures comprehension scores. Identify the variables:", "options": [{"letter": "A", "text": "Font size is the dependent variable; comprehension score is the independent variable"}, {"letter": "B", "text": "Both are independent variables"}, {"letter": "C", "text": "Font size is the independent variable; comprehension score is the dependent variable"}, {"letter": "D", "text": "Comprehension score is a confound"}], "correct": "C", "explanation": "The manipulated variable is the IV (font size); the measured outcome that may depend on it is the DV (comprehension)."}, {"type": "single", "stem": "All of the following are techniques for handling order effects in a within-subjects design EXCEPT:", "options": [{"letter": "A", "text": "Counterbalancing the order of conditions"}, {"letter": "B", "text": "Randomising the order of conditions across participants"}, {"letter": "C", "text": "Using a between-subjects design instead"}, {"letter": "D", "text": "Convenience sampling of participants"}], "correct": "D", "explanation": "Counterbalancing and randomising condition order address order effects; switching to between-subjects avoids them entirely. Convenience sampling concerns how participants are recruited, not order effects."}, {"type": "single", "stem": "In a within-subjects design, the same participants experience all conditions. The main internal-validity threat this introduces — and the reason counterbalancing exists — is:", "options": [{"letter": "A", "text": "Low external validity"}, {"letter": "B", "text": "Order effects (e.g. practice or fatigue carrying over between conditions)"}, {"letter": "C", "text": "Convenience sampling bias"}, {"letter": "D", "text": "Confirmation bias on the part of the researcher analysing the outcomes"}], "correct": "B", "explanation": "When each participant does every condition, the sequence can affect performance (practice, fatigue, carry-over). Counterbalancing distributes these order effects across conditions."}, {"type": "single", "stem": "Random assignment to conditions primarily serves to:", "options": [{"letter": "A", "text": "Ensure the sample represents the population (external validity)"}, {"letter": "B", "text": "Guarantee statistical significance"}, {"letter": "C", "text": "Make groups equivalent on average, controlling for unknown confounds"}, {"letter": "D", "text": "Remove the need for a separate control or comparison group entirely"}], "correct": "C", "explanation": "Random assignment balances both known and unknown participant variables across groups on average, supporting internal validity. It is distinct from random sampling, which supports external validity."}, {"type": "true_false", "stem": "Random sampling and random assignment serve the same purpose and can be used interchangeably.", "correct": false, "explanation": "False. Random sampling concerns selecting participants from a population (external validity); random assignment concerns allocating participants to conditions (internal validity). They address different problems."}, {"type": "single", "stem": "The Clever Hans case (the horse that appeared to do arithmetic) is used to illustrate the importance of:", "options": [{"letter": "A", "text": "Ruling out alternative explanations before accepting a hypothesis"}, {"letter": "B", "text": "Counterbalancing the order in which conditions are presented to participants"}, {"letter": "C", "text": "Using large samples"}, {"letter": "D", "text": "Disclosing AI use in research"}], "correct": "A", "explanation": "Hans was responding to unconscious cues from questioners, not doing arithmetic. The case shows researchers must rule out mundane alternative explanations (here, experimenter cueing) before crediting the dramatic one."}, {"type": "single", "stem": "A study recruits participants by posting a link in a university psychology course. The most direct validity concern is:", "options": [{"letter": "A", "text": "Order effects, because conditions are not counterbalanced"}, {"letter": "B", "text": "Construct validity, because the DV is mismeasured"}, {"letter": "C", "text": "Internal validity, because the independent variable was measured rather than experimentally manipulated"}, {"letter": "D", "text": "External validity, because a convenience sample may not generalise to the wider population"}], "correct": "D", "explanation": "Recruiting from an easily reached group is convenience sampling. The risk is that the sample is unrepresentative, limiting generalisation (external validity)."}, {"type": "single", "stem": "Kobak et al.'s approach to detecting LLM-written text in scientific papers is based on:", "options": [{"letter": "A", "text": "Reviewers manually flagging suspicious phrasing"}, {"letter": "B", "text": "A spike in 'excess' usage of certain words (vocabulary) relative to prior years"}, {"letter": "C", "text": "Hidden statistical watermarks that LLM providers embed in the text they generate"}, {"letter": "D", "text": "Comparing submission timestamps with model release dates"}], "correct": "B", "explanation": "The method detects an abrupt rise in the frequency of particular words (excess vocabulary) coinciding with LLM availability, used as a population-level signal of AI-assisted writing."}, {"type": "single", "stem": "A 2023 Nature survey on AI use in research is cited to show that:", "options": [{"letter": "A", "text": "Researchers hold mixed and divided attitudes toward using AI tools"}, {"letter": "B", "text": "Most researchers had never heard of large language models"}, {"letter": "C", "text": "AI tools were banned by nearly all journals"}, {"letter": "D", "text": "Papers written with AI assistance consistently outperform those written without it"}], "correct": "A", "explanation": "The survey is used to convey the spread of attitudes — enthusiasm, caution, and concern coexist — rather than a consensus for or against AI use."}, {"type": "true_false", "stem": "The controversy over listing ChatGPT as an author concluded that AI tools can be credited as co-authors provided their use is disclosed.", "correct": false, "explanation": "False. The prevailing position is that an AI tool cannot be an author because it cannot take responsibility/accountability for the work; its use should instead be disclosed in the methods or acknowledgements."}, {"type": "single", "stem": "Which statement best captures why an LLM cannot be listed as an author of a scientific paper, per the disclosure-policy discussion?", "options": [{"letter": "A", "text": "Journal submission systems lack a metadata field for listing non-human authors"}, {"letter": "B", "text": "It does not own intellectual property"}, {"letter": "C", "text": "It cannot take responsibility or accountability for the content"}, {"letter": "D", "text": "It cannot read the final manuscript"}], "correct": "C", "explanation": "Authorship entails accountability for the work's integrity, which an AI system cannot bear. Hence disclosure of use, not authorship, is the accepted norm."}, {"type": "assertion_reason", "assertion": "A correlation between two variables is sufficient evidence that one causes the other.", "reason": "A confounding third variable can produce a correlation without any direct causal link between the two variables.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "D", "explanation": "The assertion is false (correlation is not sufficient for causation). The reason is true and is precisely why the assertion fails — confounds like temperature in the ice-cream/shark example create non-causal correlations."}, {"type": "single", "stem": "Which scenario most clearly threatens internal rather than external validity?", "options": [{"letter": "A", "text": "All participants happen to be undergraduate students drawn from a single university"}, {"letter": "B", "text": "The study uses only English-speaking participants"}, {"letter": "C", "text": "Participants in the treatment group are tested in the morning and controls in the afternoon"}, {"letter": "D", "text": "Results are reported only for the subset who completed all sessions"}], "correct": "C", "explanation": "Time-of-day systematically differs with condition, becoming a confound that offers an alternative explanation for any effect — an internal-validity problem. The others limit generalisation (external validity)."}, {"type": "single", "stem": "In the deduction step of the empirical cycle, a theory is used to derive a specific, ________ hypothesis that could be contradicted by data.", "options": [{"letter": "A", "text": "subjective"}, {"letter": "B", "text": "falsifiable"}, {"letter": "C", "text": "inductive"}, {"letter": "D", "text": "confirmable-only"}], "correct": "B", "explanation": "Deduction should produce a falsifiable hypothesis — one a test could in principle prove wrong."}, {"type": "single", "stem": "Which of the following is the clearest example of the availability heuristic affecting a research judgement?", "options": [{"letter": "A", "text": "A reviewer judges a candidate mainly by how closely they match a familiar stereotype"}, {"letter": "B", "text": "A reviewer claims they predicted the result before seeing it"}, {"letter": "C", "text": "A reviewer trusts a result because it matches their prior hypothesis"}, {"letter": "D", "text": "A reviewer assumes a method is widely used because they recently saw several papers using it"}], "correct": "D", "explanation": "Judging frequency or importance by ease of recall (recently seen papers) is availability. The distractors map onto confirmation bias, hindsight bias, and representativeness respectively."}, {"type": "single", "stem": "Why does the lecture treat generalisation (external validity) as a 'leap' that requires justification rather than something automatic?", "options": [{"letter": "A", "text": "Conclusions drawn from a particular sample and setting may not hold for other populations or conditions"}, {"letter": "B", "text": "Random assignment only balances measured variables"}, {"letter": "C", "text": "Statistical significance does not transfer between studies"}, {"letter": "D", "text": "The number of confounding variables always grows as the sample size increases"}], "correct": "A", "explanation": "External validity is never guaranteed: an effect found in one sample/setting may not extend elsewhere (cf. Gender Shades), so generalisation must be argued, not assumed."}, {"type": "single", "stem": "A psychologist measures whether students who sleep more get higher grades, without manipulating sleep. This is best classified as:", "options": [{"letter": "A", "text": "A correlational study"}, {"letter": "B", "text": "A within-subjects experiment"}, {"letter": "C", "text": "An experimental study"}, {"letter": "D", "text": "A randomised controlled trial"}], "correct": "A", "explanation": "Sleep is measured as it naturally occurs, not manipulated. Relating two measured variables makes it correlational, so causal claims are not licensed."}, {"type": "single", "stem": "Which of the following is NOT one of the cognitive biases or heuristics discussed in the scientific-thinking section?", "options": [{"letter": "A", "text": "Availability heuristic"}, {"letter": "B", "text": "Hindsight bias"}, {"letter": "C", "text": "Survivorship bias"}, {"letter": "D", "text": "Confirmation bias"}], "correct": "C", "explanation": "The lecture covers confirmation bias (Wason), the availability and representativeness heuristics, and hindsight bias. Survivorship bias, while real, is not among the three problems presented."}, {"type": "single", "stem": "The serial-position example is used to illustrate which step of the empirical cycle?", "options": [{"letter": "A", "text": "Observation — noting a phenomenon"}, {"letter": "B", "text": "Deduction — deriving a testable prediction"}, {"letter": "C", "text": "Evaluation — judging the hypothesis"}, {"letter": "D", "text": "Induction — inferring a general pattern from observed data"}], "correct": "D", "explanation": "Observing better memory for early and late list items and inferring a general 'serial-position' pattern is inductive generalisation."}, {"type": "true_false", "stem": "An effect found only in a tightly controlled lab study may have limited external validity, because the artificial setting can fail to represent real-world conditions.", "correct": true, "explanation": "True. Tight experimental control strengthens internal validity but the artificial setting may not represent everyday conditions, so external validity (generalisation) can be limited."}, {"type": "single", "stem": "Counterbalancing means:", "options": [{"letter": "A", "text": "Matching the treatment and control groups on a set of key background variables"}, {"letter": "B", "text": "Varying the order of conditions across participants so order effects are distributed evenly"}, {"letter": "C", "text": "Balancing the number of participants in each group"}, {"letter": "D", "text": "Randomly sampling from the target population"}], "correct": "B", "explanation": "Counterbalancing systematically rotates condition order (e.g. half do A then B, half B then A) so practice/fatigue effects do not consistently favour one condition."}, {"type": "single", "stem": "Which design choice is the most appropriate response to severe carry-over effects (where doing one condition permanently changes how a participant behaves in another)?", "options": [{"letter": "A", "text": "Increase the sample size"}, {"letter": "B", "text": "Use a between-subjects design"}, {"letter": "C", "text": "Counterbalance the condition order"}, {"letter": "D", "text": "Randomise the condition order within participants"}], "correct": "B", "explanation": "Counterbalancing and randomising can address symmetric, temporary order effects but not permanent carry-over. When exposure to one condition irreversibly contaminates another, separate groups (between-subjects) are needed."}, {"type": "single", "stem": "Which of these best describes the relationship between internal and external validity in study design?", "options": [{"letter": "A", "text": "External validity must always be established before internal validity can be assessed"}, {"letter": "B", "text": "They always increase together"}, {"letter": "C", "text": "There is often a trade-off: increasing control can raise internal validity while lowering external validity"}, {"letter": "D", "text": "They are the same thing measured differently"}], "correct": "C", "explanation": "Highly controlled designs strengthen causal (internal) claims but can make the setting unrepresentative, weakening generalisation (external). Researchers balance the two."}, {"type": "single", "stem": "A study concludes a new tutoring app 'causes' better grades, but students chose whether to use it. The strongest objection is that:", "options": [{"letter": "A", "text": "The order of conditions was not properly counterbalanced across participants"}, {"letter": "B", "text": "The sample was too small"}, {"letter": "C", "text": "The DV was poorly defined"}, {"letter": "D", "text": "Self-selection is a confound — motivated students may both use the app and study harder"}], "correct": "D", "explanation": "Because students were not randomly assigned, pre-existing differences (motivation) plausibly cause both app use and grades — a confound undermining the causal claim."}, {"type": "assertion_reason", "assertion": "Counterbalancing is unnecessary in a between-subjects design.", "reason": "In a between-subjects design, each participant experiences only one condition, so there is no condition order to counterbalance.", "options": [{"letter": "A", "text": "Both the assertion and the reason are true, and the reason correctly explains the assertion."}, {"letter": "B", "text": "Both the assertion and the reason are true, but the reason does not correctly explain the assertion."}, {"letter": "C", "text": "The assertion is true, but the reason is false."}, {"letter": "D", "text": "The assertion is false, but the reason is true."}, {"letter": "E", "text": "Both the assertion and the reason are false."}], "correct": "A", "explanation": "Both true, and the reason explains the assertion: with one condition per participant, order effects cannot arise within a participant, so counterbalancing has nothing to balance."}, {"type": "single", "stem": "The course's genAI rules and journal disclosure policies share which underlying principle?", "options": [{"letter": "A", "text": "Transparency about how AI tools were used in producing the work"}, {"letter": "B", "text": "A blanket prohibition on any AI assistance"}, {"letter": "C", "text": "Requiring all AI output to be manually rewritten"}, {"letter": "D", "text": "Formally crediting the AI systems involved as named co-authors of the paper"}], "correct": "A", "explanation": "Both emphasise disclosure/transparency: use may be permitted under conditions, but it must be declared so readers can judge the work."}, {"type": "single", "stem": "Which is the best operational definition of a confound?", "options": [{"letter": "A", "text": "The dependent variable when it is measured with error"}, {"letter": "B", "text": "Any background variable that the researchers happened not to measure in the study"}, {"letter": "C", "text": "A variable that varies systematically with the IV and offers an alternative explanation for the effect on the DV"}, {"letter": "D", "text": "A variable that is randomly assigned across conditions"}], "correct": "C", "explanation": "A confound is correlated with the manipulation and could itself produce the observed change in the outcome, blocking a clean causal interpretation."}, {"type": "single", "stem": "A researcher generates a hypothesis only after seeing surprising data, then presents it as if predicted in advance. In bias terms during interpretation, this resembles:", "options": [{"letter": "A", "text": "Hindsight bias dressed up as prediction"}, {"letter": "B", "text": "A common-response confound driving two correlated variables"}, {"letter": "C", "text": "The availability heuristic"}, {"letter": "D", "text": "Convenience sampling"}], "correct": "A", "explanation": "Reconstructing a result as 'expected all along' once it is known is hindsight bias. (It also foreshadows HARKing, covered later in the course.)"}, {"type": "true_false", "stem": "Induction can produce certain, logically guaranteed conclusions about the general case from a finite set of observations.", "correct": false, "explanation": "False. Induction generalises beyond the data and is therefore never logically guaranteed — this is the 'leap of faith' in the empirical cycle."}, {"type": "single", "stem": "Which best distinguishes the representativeness heuristic from the availability heuristic?", "options": [{"letter": "A", "text": "Both heuristics arrive at their judgements primarily by weighing the relevant base rates"}, {"letter": "B", "text": "Representativeness judges by similarity to a prototype; availability judges by ease of recall"}, {"letter": "C", "text": "Representativeness judges by ease of recall; availability judges by similarity"}, {"letter": "D", "text": "Representativeness applies only to people, availability only to events"}], "correct": "B", "explanation": "Representativeness = 'how typical/similar is this to the category?' (Arthur the librarian). Availability = 'how easily do examples come to mind?' Both can ignore base rates, but via different routes."}, {"type": "single", "stem": "In an experiment, what is the primary role of a control group?", "options": [{"letter": "A", "text": "To ensure random sampling from the population"}, {"letter": "B", "text": "To counterbalance the order effects that arise within participants"}, {"letter": "C", "text": "To increase the sample's representativeness"}, {"letter": "D", "text": "To provide a comparison baseline so the effect of the manipulation can be isolated"}], "correct": "D", "explanation": "A control (no-treatment or standard-treatment) group establishes what happens without the manipulation, letting researchers attribute differences to the IV."}, {"type": "single", "stem": "Which research conclusion is most defensible given only correlational data?", "options": [{"letter": "A", "text": "The two variables are associated; further work is needed to test causal explanations"}, {"letter": "B", "text": "There is no relationship between the variables"}, {"letter": "C", "text": "One variable causes the other"}, {"letter": "D", "text": "A confounding common cause has been conclusively ruled out by the data"}], "correct": "A", "explanation": "Correlational data support claims of association and motivate causal hypotheses, but cannot by themselves establish causation or rule out confounds."}, {"type": "single", "stem": "Why is falsifiability preferred over mere confirmability as a criterion for scientific hypotheses?", "options": [{"letter": "A", "text": "Confirming evidence is impossible to obtain in purely correlational studies"}, {"letter": "B", "text": "Many false theories can accumulate confirming instances; only a potential falsifier provides a genuine test"}, {"letter": "C", "text": "Falsifiable hypotheses are always simpler"}, {"letter": "D", "text": "Confirmation requires larger samples than falsification"}], "correct": "B", "explanation": "Confirmations are easy to find even for wrong theories (cf. confirmation bias / Wason). A hypothesis earns scientific status by risking refutation through a possible falsifying observation."}, {"type": "single", "stem": "A face-recognition vendor reports 99% overall accuracy but is later shown to fail badly for certain demographic groups. Connecting this to Week 1, the headline accuracy figure is misleading mainly because of poor:", "options": [{"letter": "A", "text": "Random assignment"}, {"letter": "B", "text": "Internal validity, undermined by an unmeasured confounding variable"}, {"letter": "C", "text": "Counterbalancing"}, {"letter": "D", "text": "External validity across subpopulations"}], "correct": "D", "explanation": "Aggregate accuracy on one distribution can hide failure to generalise to other groups — the Gender Shades lesson about external validity."}, {"type": "single", "stem": "Which of the following is NOT a reason the lecture gives for studying cognitive biases in a research-methods course?", "options": [{"letter": "A", "text": "Scientific method exists partly to counteract self-deception"}, {"letter": "B", "text": "Biased reasoning can corrupt how data are gathered and interpreted"}, {"letter": "C", "text": "Biases make statistical tests invalid by inflating sample sizes"}, {"letter": "D", "text": "Researchers are themselves susceptible to these biases"}], "correct": "C", "explanation": "Biases are studied because they affect researchers and motivate methodological safeguards (Feynman). They do not 'inflate sample sizes' — that option is a fabricated mechanism."}, {"type": "single", "stem": "Which pairing of example and concept is correct?", "options": [{"letter": "A", "text": "Arthur the librarian → hindsight bias"}, {"letter": "B", "text": "Clever Hans → ruling out alternative explanations"}, {"letter": "C", "text": "Chocolate–Nobel → internal validity confound within an experiment"}, {"letter": "D", "text": "Gender Shades → confirmation bias"}], "correct": "B", "explanation": "Clever Hans illustrates ruling out alternatives. Chocolate–Nobel illustrates correlation≠causation (a spurious correlation), Gender Shades illustrates external validity, and Arthur illustrates representativeness."}]}</script>
<script>
"use strict";
var QUIZ = JSON.parse(document.getElementById("quiz-data").textContent);
var submitted = false;
document.getElementById("title").textContent = QUIZ.title;
document.title = QUIZ.title;

function elem(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function radioOpt(name, value, labelText, bare) {
  var id = name + "_" + value;
  var input = elem("input", { type: "radio", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("span", bare ? {} : { class: "opt" }, [input, label]);
}
function checkOpt(name, value, labelText) {
  var id = name + "_" + value;
  var input = elem("input", { type: "checkbox", name: name, value: value, id: id });
  var label = elem("label", { for: id, text: labelText });
  return elem("div", { class: "opt" }, [input, label]);
}

function buildQuestion(q, idx) {
  var card = elem("div", { class: "q", id: "q" + idx });
  var name = "q" + idx;
  if (q.type === "assertion_reason") {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + "." }));
    var a = elem("p", { class: "ar-line" });
    a.appendChild(elem("strong", { text: "Assertion: " }));
    a.appendChild(document.createTextNode(q.assertion));
    card.appendChild(a);
    var r = elem("p", { class: "ar-line" });
    r.appendChild(elem("strong", { text: "Reason: " }));
    r.appendChild(document.createTextNode(q.reason));
    card.appendChild(r);
  } else {
    card.appendChild(elem("p", { class: "stem", text: (idx + 1) + ". " + (q.stem || "") }));
  }

  if (q.type === "single" || q.type === "assertion_reason") {
    var fs = elem("fieldset");
    fs.appendChild(elem("legend", { text: "Choose one answer" }));
    q.options.forEach(function (o) {
      fs.appendChild(radioOpt(name, o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fs);
  } else if (q.type === "true_false") {
    var fs2 = elem("fieldset");
    fs2.appendChild(elem("legend", { text: "True or False" }));
    fs2.appendChild(radioOpt(name, "true", "True"));
    fs2.appendChild(radioOpt(name, "false", "False"));
    card.appendChild(fs2);
  } else if (q.type === "multi") {
    card.appendChild(elem("p", { class: "right-col", text: "Select all that apply." }));
    q.options.forEach(function (o) {
      card.appendChild(checkOpt(name, o.letter, o.letter + ") " + o.text));
    });
  } else if (q.type === "mtf") {
    q.statements.forEach(function (s, j) {
      var sname = name + "_s" + j;
      var row = elem("div", { class: "stmt" });
      row.appendChild(elem("span", { class: "stmt-text", text: (j + 1) + ". " + s.text }));
      var tf = elem("span", { class: "stmt-tf" }, [
        radioOpt(sname, "true", "True", true),
        radioOpt(sname, "false", "False", true)
      ]);
      row.appendChild(tf);
      card.appendChild(row);
    });
  } else if (q.type === "two_tier") {
    var fsa = elem("fieldset");
    fsa.appendChild(elem("legend", { text: "Tier 1" }));
    q.tier1.options.forEach(function (o) {
      fsa.appendChild(radioOpt(name + "_t1", o.letter, o.letter + ") " + o.text));
    });
    card.appendChild(fsa);
    var tier = elem("div", { class: "tier" });
    tier.appendChild(elem("div", { class: "tier-q", text: q.tier2.stem }));
    var fsb = elem("fieldset");
    fsb.appendChild(elem("legend", { text: "Tier 2" }));
    q.tier2.options.forEach(function (o) {
      fsb.appendChild(radioOpt(name + "_t2", o.letter, o.letter + ") " + o.text));
    });
    tier.appendChild(fsb);
    card.appendChild(tier);
  } else if (q.type === "matching") {
    var tbl = elem("table", { class: "match" });
    q.lefts.forEach(function (l) {
      var sel = elem("select", { id: name + "_l" + l.num, "aria-label": "Match for " + l.text });
      sel.appendChild(elem("option", { value: "", text: "—" }));
      q.rights.forEach(function (rr) {
        sel.appendChild(elem("option", { value: rr.letter, text: rr.letter }));
      });
      var td1 = elem("td", { text: l.num + ". " + l.text });
      var td2 = elem("td", null, [sel]);
      tbl.appendChild(elem("tr", null, [td1, td2]));
    });
    card.appendChild(tbl);
    var rl = elem("div", { class: "right-col" }, [elem("p", { text: "Options:" })]);
    q.rights.forEach(function (rr) {
      rl.appendChild(elem("div", { text: rr.letter + ") " + rr.text }));
    });
    card.appendChild(rl);
  } else if (q.type === "ordering") {
    var n = q.items.length;
    card.appendChild(elem("p", { class: "right-col", text: "Assign each item a position (1 = first)." }));
    q.items.forEach(function (it) {
      var row = elem("div", { class: "li-pos" });
      var sel = elem("select", { id: name + "_pos" + it.id, "aria-label": "Position for " + it.text });
      sel.appendChild(elem("option", { value: "", text: "#" }));
      for (var p = 1; p <= n; p++) sel.appendChild(elem("option", { value: String(p), text: String(p) }));
      row.appendChild(sel);
      row.appendChild(elem("span", { class: "li-text", text: it.text }));
      card.appendChild(row);
    });
  }

  card.appendChild(elem("div", { class: "feedback", id: name + "_fb" }));
  return card;
}

function getRadio(name) {
  var r = document.querySelector('input[name="' + name + '"]:checked');
  return r ? r.value : null;
}

function gradeQuestion(q, idx) {
  var name = "q" + idx;
  var correct = false;
  var ansText = "";
  if (q.type === "single" || q.type === "assertion_reason") {
    correct = getRadio(name) === q.correct;
    ansText = "Correct answer: " + q.correct;
  } else if (q.type === "true_false") {
    correct = (getRadio(name) === "true") === q.correct;
    ansText = "Correct answer: " + (q.correct ? "True" : "False");
  } else if (q.type === "multi") {
    var chosen = Array.prototype.slice.call(
      document.querySelectorAll('input[name="' + name + '"]:checked'))
      .map(function (c) { return c.value; }).sort();
    var key = q.correct.slice().sort();
    correct = chosen.length === key.length && chosen.every(function (v, i) { return v === key[i]; });
    ansText = "Correct selection: " + key.join(", ");
  } else if (q.type === "mtf") {
    var all = true; var parts = [];
    q.statements.forEach(function (s, j) {
      var ok = (getRadio(name + "_s" + j) === "true") === s.answer;
      if (!ok) all = false;
      parts.push((j + 1) + ": " + (s.answer ? "True" : "False"));
      var row = document.querySelectorAll("#q" + idx + " .stmt")[j];
      if (row) row.appendChild(elem("span", { class: "mark " + (ok ? "ok" : "no"), text: ok ? "✓" : "✗" }));
    });
    correct = all;
    ansText = "Correct: " + parts.join(", ");
  } else if (q.type === "two_tier") {
    correct = getRadio(name + "_t1") === q.tier1.correct && getRadio(name + "_t2") === q.tier2.correct;
    ansText = "Correct: tier 1 = " + q.tier1.correct + ", tier 2 = " + q.tier2.correct;
  } else if (q.type === "matching") {
    var allm = true; var parts2 = [];
    q.lefts.forEach(function (l) {
      var sel = document.getElementById(name + "_l" + l.num);
      var want = q.answer[String(l.num)];
      if (!sel || sel.value !== want) allm = false;
      parts2.push(l.num + "→" + want);
    });
    correct = allm;
    ansText = "Correct matches: " + parts2.join(", ");
  } else if (q.type === "ordering") {
    var placed = [];
    q.items.forEach(function (it) {
      var sel = document.getElementById(name + "_pos" + it.id);
      placed.push({ id: it.id, pos: sel ? parseInt(sel.value, 10) : NaN });
    });
    placed.sort(function (a, b) { return a.pos - b.pos; });
    var seq = placed.map(function (p) { return p.id; });
    correct = seq.length === q.correct_order.length &&
              seq.every(function (v, i) { return v === q.correct_order[i]; });
    var byId = {}; q.items.forEach(function (it) { byId[it.id] = it.text; });
    ansText = "Correct order: " + q.correct_order.map(function (id, i) {
      return (i + 1) + ". " + byId[id]; }).join("  |  ");
  }

  var card = document.getElementById("q" + idx);
  card.classList.remove("correct", "incorrect");
  card.classList.add(correct ? "correct" : "incorrect");
  var fb = document.getElementById(name + "_fb");
  fb.innerHTML = "";
  fb.appendChild(elem("div", { class: "verdict " + (correct ? "ok" : "no"),
    text: correct ? "Correct" : "Incorrect" }));
  fb.appendChild(elem("div", { class: "ans", text: ansText }));
  if (q.explanation) fb.appendChild(elem("div", { class: "expl", text: q.explanation }));
  fb.classList.add("show");
  return correct;
}

function checkAll() {
  if (submitted) return;
  submitted = true;
  var score = 0;
  QUIZ.questions.forEach(function (q, i) { if (gradeQuestion(q, i)) score++; });
  document.getElementById("score").textContent = "Score: " + score + " / " + QUIZ.questions.length;
  document.getElementById("check").disabled = true;
}

function reset() {
  submitted = false;
  document.getElementById("check").disabled = false;
  document.getElementById("score").textContent = "";
  document.getElementById("quiz").innerHTML = "";
  buildAll();
}

function buildAll() {
  var container = document.getElementById("quiz");
  QUIZ.questions.forEach(function (q, i) { container.appendChild(buildQuestion(q, i)); });
}

document.getElementById("check").addEventListener("click", checkAll);
document.getElementById("reset").addEventListener("click", reset);
buildAll();
</script>
</body>
</html>
